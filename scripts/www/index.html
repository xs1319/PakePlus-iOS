<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>水墨五子棋</title>
    <style>
        :root {
            --paper-color: #faf9f5; 
            --sun-red: #eb8c84;
            --btn-leave: rgba(217, 101, 86, 0.9);
            --btn-undo: rgba(86, 127, 188, 0.9);
            --btn-restart: rgba(142, 97, 189, 0.9);
            --btn-setting: rgba(77, 158, 117, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            touch-action: none; 
            overscroll-behavior: none;
            -webkit-user-select: none; 
            user-select: none;
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background-color: #2c3e50;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 600px; 
            height: 100%;
            position: relative;
            background: #e6e9e4;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 撒花特效 */
        .confetti{
            position:fixed;top:-24px;width:9px;height:15px;border-radius:2px;
            z-index:2000;pointer-events:none;animation:fall linear forwards;
        }
        @keyframes fall{to{transform:translateY(108vh) rotate(760deg);opacity:.15;}}

        /* --- 1. 主界面 --- */
        #mainMenu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            background-color: #f4f1ea;
            transition: opacity 0.5s ease;
            background-image: 
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect width="100%" height="100%" fill="%23f4f1ea"/><path d="M0 700 Q150 600 300 750 T600 700 L600 1000 L0 1000 Z" fill="%23dcd5c6" opacity="0.6"/><path d="M100 800 Q250 700 400 820 T800 780 L800 1000 L100 1000 Z" fill="%23c6beac" opacity="0.4"/><circle cx="400" cy="250" r="50" fill="%23d97566" opacity="0.8"/><path d="M300 400 Q350 350 400 400 T500 400" fill="none" stroke="%23333" stroke-width="2" opacity="0.2"/></svg>');
            background-size: 100% 100%;
            background-position: center;
        }

        #mainMenu.hidden { opacity: 0; pointer-events: none; }

        /* 主界面静音按钮 - 无外圈 */
        .sound-btn {
            position: absolute;
            top: 20px; right: 20px;
            width: 50px; height: 50px;
            background: transparent; 
            border: none;            
            outline: none;
            font-size: 32px;         
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 20;
        }
        .sound-btn:active { transform: scale(0.9); }

        .main-title {
            font-family: "STXingkai", "华文行楷", "STKaiti", cursive;
            font-size: 90px; color: #2b2b2b; margin-bottom: 60px;
            text-shadow: 2px 4px 15px rgba(0,0,0,0.1);
            letter-spacing: 15px; writing-mode: vertical-rl; text-orientation: upright;
            z-index: 10;
        }

        .menu-btn {
            width: 220px; height: 60px; margin: 15px 0;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #3e3e3e; border-radius: 30px;
            font-size: 22px; font-family: "STKaiti", serif;
            color: #3e3e3e; font-weight: bold; cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            transition: all 0.2s; backdrop-filter: blur(5px); z-index: 10;
        }
        .menu-btn:active { background: #3e3e3e; color: #fff; transform: scale(0.95); }

        .copyright {
            position: absolute; bottom: calc(30px + env(safe-area-inset-bottom)); font-size: 14px; color: #888;
            letter-spacing: 2px; font-family: Arial, sans-serif; z-index: 10;
        }

        /* --- 2. 游戏界面 --- */
        #gameUI {
            display: none; flex-direction: column; width: 100%; height: 100%; padding: 10px;
            position: relative; 
            background-color: var(--paper-color);
        }
        #gameUI.active { display: flex; }

        /* 水墨背景 */
        .artwork-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; 
            pointer-events: none; 
            opacity: 0.65; 
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.7) 0%, transparent 100%),
                linear-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        .artwork-bg svg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            preserveAspectRatio: none; 
        }

        /* 顶部信息栏 */
        .header {
            position: relative; z-index: 10;
            display: flex; height: 64px; margin: 5px 0 0; 
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
            backdrop-filter: blur(8px); 
        }
        .player-info.left { 
            flex: 1; display: flex; align-items: center; padding: 0 15px; color: white; 
            background: linear-gradient(135deg, rgba(60,60,60,0.85), rgba(30,30,30,0.85)); 
        }
        .player-info.right { 
            flex: 1; display: flex; align-items: center; padding: 0 15px; justify-content: flex-end; 
            background: linear-gradient(225deg, rgba(240,240,240,0.85), rgba(210,210,210,0.85)); 
            color: #333;
        }
        
        .avatar {
            width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.8);
            background: #e6d5c3 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="25" fill="%235c4b40"/><path d="M15 90 Q50 50 85 90" fill="%235c4b40"/></svg>') center/cover;
        }
        .player-info.left .avatar { margin-right: 10px; border-color: rgba(255,255,255,0.3); }
        .player-info.right .avatar { margin-left: 10px; border-color: rgba(0,0,0,0.1); background: #e6d5c3 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="25" fill="%238b7355"/><path d="M15 90 Q50 50 85 90" fill="%238b7355"/></svg>') center/cover; }
        
        .player-text { display: flex; flex-direction: column; }
        .player-name { font-size: 15px; font-weight: bold; }
        .player-turn-indicator {
            width: 16px; height: 16px; border-radius: 50%; margin-top: 4px;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.5), inset 2px 2px 4px rgba(255,255,255,0.8);
            opacity: 0; transition: opacity 0.3s;
        }
        .player-turn-indicator.active { opacity: 1; }
        .player-turn-indicator.black { background: radial-gradient(circle at 30% 30%, #555, #000); }
        .player-turn-indicator.white { background: radial-gradient(circle at 30% 30%, #fff, #ccc); border: 1px solid #bbb; }
        .player-info.right .player-turn-indicator { align-self: flex-end; }

        .vs-badge {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) skewX(-15deg);
            z-index: 10;
        }
        .vs-badge .vs-text {
            font-size: 22px; font-weight: 900; color: #ffcc00;
            text-shadow: 2px 2px 0 #8a5a00, -1px -1px 0 #fff; 
        }

        /* 倒计时与沙漏 */
        .timer-row {
            position: relative; z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60px;
            margin-top: 15px; 
            margin-bottom: 20px; 
        }
        .hourglass-icon {
            width: 33px;  
            height: 33px; 
            fill: #4a4a4a;
            margin-right: 12px;
            transition: transform 0.4s ease-in-out;
        }
        .timer-text {
            font-size: 22px;
            font-family: monospace;
            font-weight: bold;
            color: #333;
            background: rgba(255,255,255,0.7);
            padding: 2px 15px;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: color 0.3s;
        }
        .timer-text.danger {
            color: #ff3333;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* 棋盘区域 */
        .board-wrapper { 
            position: relative; z-index: 10;
            flex: 1; display: flex; justify-content: center; align-items: center; 
            width: 100%; overflow: hidden; 
        }
        
        .board-frame {
            background: rgba(255, 255, 255, 0.4); 
            border-radius: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15), 0 0 0 1px rgba(255,255,255,0.3);
            position: relative;
            backdrop-filter: blur(2px); 
            display: flex; justify-content: center; align-items: center;
            padding: 4px;
        }

        canvas { 
            background-color: rgba(255, 255, 255, 0.55); 
            display: block; cursor: pointer; border-radius: 4px; 
            touch-action: none; 
        }

        /* 底部按钮 */
        .footer { 
            position: relative; z-index: 10;
            display: flex; justify-content: space-around; gap: 8px;
            margin-top: 15px; 
            padding-bottom: calc(40px + env(safe-area-inset-bottom)); 
        }
        .btn {
            flex: 1; height: 44px; border-radius: 22px; border: none; color: white;
            font-size: 15px; font-weight: bold; display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.15), inset 0 2px 4px rgba(255,255,255,0.3);
            transition: transform 0.1s; backdrop-filter: blur(5px);
        }
        .btn:active { transform: scale(0.95); }
        .btn svg { width: 18px; height: 18px; margin-right: 4px; fill: white; }
        .btn-leave { background: var(--btn-leave); }
        .btn-undo { background: var(--btn-undo); }
        .btn-restart { background: var(--btn-restart); }
        .btn-setting { background: var(--btn-setting); }

        /* 轻提示 Toast */
        .toast {
            position: absolute; top: 120px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 10px 20px;
            border-radius: 20px; font-size: 14px; z-index: 1000;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; }

        /* 弹窗样式 */
        .modal-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center;
            z-index: 1000; backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }

        .confirm-box {
            background: #fff; width: 280px; border-radius: 12px; padding: 25px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: popIn 0.2s ease-out;
        }
        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .confirm-msg { font-size: 18px; color: #333; margin-bottom: 25px; }
        .confirm-btns { display: flex; gap: 15px; }
        .confirm-btns button {
            flex: 1; padding: 10px 0; border-radius: 20px; border: none; font-size: 16px; cursor: pointer; font-weight: bold;
        }
        .btn-cancel { background: #eee; color: #555; }
        .btn-ok { background: #4d9e75; color: #fff; }

        .menu-box {
            background: #fdfcf9; border-radius: 10px; width: 260px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); overflow: hidden; border: 1px solid rgba(0,0,0,0.1);
            animation: slideDown 0.2s ease-out;
        }
        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .menu-item {
            padding: 15px 20px; font-size: 18px; color: #3e3e3e; border-bottom: 1px solid rgba(0,0,0,0.05);
            text-align: center; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            transition: background 0.2s;
        }
        .menu-item:hover { background: #f0ede6; }
    </style>
</head>
<body>

<!-- 强制防缩放拦截 -->
<script>
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) { event.preventDefault(); }
        lastTouchEnd = now;
    }, false);
    document.addEventListener('touchmove', function (e) {
        if (e.touches.length > 1) { e.preventDefault(); }
    }, { passive: false });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
</script>

<div class="app-container">
    <div id="mainMenu">
        <!-- 全局静音按钮 (无外圈) -->
        <button id="btnSound" class="sound-btn">🔊</button>
        
        <div class="main-title">五子棋</div>
        <button class="menu-btn" onclick="SFX.click(); openPVESetup()">人机对战</button>
        <button class="menu-btn" onclick="SFX.click(); startGame('pvp')">双人对战</button>
        <div class="copyright">Produced By MrXiao</div>
    </div>

    <div id="gameUI">
        
        <!-- 水墨半透明背景 -->
        <div class="artwork-bg">
            <svg viewBox="0 0 600 850" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                <defs>
                    <filter id="inkSoft" x="-10%" y="-10%" width="120%" height="120%">
                        <feGaussianBlur stdDeviation="1" />
                    </filter>
                    <linearGradient id="mountainGrad1" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#777" stop-opacity="0.6"/>
                        <stop offset="60%" stop-color="#999" stop-opacity="0.3"/>
                        <stop offset="100%" stop-color="#b0b0b0" stop-opacity="0"/>
                    </linearGradient>
                    <linearGradient id="mountainGrad2" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#666" stop-opacity="0.7"/>
                        <stop offset="50%" stop-color="#888" stop-opacity="0.4"/>
                        <stop offset="100%" stop-color="#aaa" stop-opacity="0"/>
                    </linearGradient>
                    <linearGradient id="mountainGradLight" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#c0c0c0" stop-opacity="0.3"/>
                        <stop offset="100%" stop-color="#e0e0e0" stop-opacity="0"/>
                    </linearGradient>
                </defs>
                <circle cx="430" cy="80" r="20" fill="var(--sun-red)" opacity="0.65" filter="url(#inkSoft)"/>
                <g stroke="#777" stroke-width="1.5" fill="none" stroke-linecap="round">
                    <path d="M 250 60 Q 255 52 260 60 Q 265 52 270 58" />
                    <path d="M 275 58 Q 280 50 285 58 Q 290 50 295 55" />
                    <path d="M 260 70 Q 265 62 270 70 Q 275 62 280 68" />
                </g>
                <g filter="url(#inkSoft)">
                    <path d="M 150 220 C 180 210, 200 180, 230 180 C 260 180, 280 200, 310 220 Z" fill="url(#mountainGradLight)"/>
                    <path d="M 200 250 C 230 240, 260 170, 290 170 C 310 170, 330 190, 350 220 C 380 200, 390 160, 420 160 C 450 160, 470 190, 490 220 C 510 210, 530 190, 550 190 L 550 260 L 200 260 Z" fill="url(#mountainGrad1)"/>
                    <path d="M 220 260 C 250 250, 280 190, 320 190 C 350 190, 370 220, 390 240 C 410 230, 430 190, 450 190 C 480 190, 500 230, 520 260 Z" fill="url(#mountainGrad2)"/>
                </g>
                <g fill="#555" filter="url(#inkSoft)" opacity="0.7">
                    <path d="M 10 -10 C 30 40, 40 80, 70 120" stroke="#666" stroke-width="2.5" fill="none"/>
                    <path d="M 40 20 C 50 50, 70 90, 100 130" stroke="#888" stroke-width="1.5" fill="none"/>
                    <path d="M 0 10 C 30 15, 50 10, 70 0 C 50 25, 20 25, 0 10 Z" />
                    <path d="M 15 35 C 40 40, 60 30, 85 20 C 60 50, 30 55, 15 35 Z" opacity="0.8"/>
                    <path d="M 40 70 C 70 80, 90 60, 110 50 C 80 85, 60 90, 40 70 Z" />
                    <path d="M 20 100 C 40 110, 60 105, 80 110 C 60 125, 30 120, 20 100 Z" opacity="0.7"/>
                    <path d="M 60 130 C 80 135, 95 130, 105 120 C 90 145, 70 145, 60 130 Z" opacity="0.6"/>
                    <path d="M 85 160 C 95 165, 100 160, 105 150 C 100 170, 90 170, 85 160 Z" opacity="0.5"/>
                </g>
                <g filter="url(#inkSoft)" opacity="0.5">
                    <path d="M 50 500 C 70 450, 110 460, 140 470 C 180 480, 220 490, 250 500 L 50 500 Z" fill="#888"/>
                    <path d="M 70 500 C 100 460, 130 465, 160 475 C 190 485, 210 490, 230 500 Z" fill="#666"/>
                </g>
                <g filter="url(#inkSoft)">
                    <path d="M 350 850 C 400 820, 430 830, 460 840 C 490 820, 530 840, 580 830 C 600 835, 600 850, 600 850 L 350 850 Z" fill="#888" opacity="0.6"/>
                    <path d="M 400 850 C 440 830, 470 835, 500 845 C 530 835, 560 850, 600 840 L 600 850 Z" fill="#666" opacity="0.7"/>
                </g>
            </svg>
        </div>

        <div class="toast" id="toast"></div>

        <!-- 顶部信息栏 -->
        <div class="header">
            <div class="player-info left" id="p1Panel">
                <div class="avatar"></div>
                <div class="player-text">
                    <span class="player-name" id="p1Name">黑方</span>
                    <div class="player-turn-indicator black active" id="p1Indicator"></div>
                </div>
            </div>
            <div class="vs-badge">
                <div class="vs-text">VS</div>
            </div>
            <div class="player-info right" id="p2Panel">
                <div class="player-text" style="text-align: right;">
                    <span class="player-name" id="p2Name">白方</span>
                    <div class="player-turn-indicator white" id="p2Indicator"></div>
                </div>
                <div class="avatar"></div>
            </div>
        </div>

        <!-- 棋盘上方倒计时沙漏 -->
        <div class="timer-row">
            <svg class="hourglass-icon" id="hourglassIcon" viewBox="0 0 24 24">
                <path d="M6 2h12v6l-4 4 4 4v6H6v-6l4-4-4-4V2zm10 14.5V16H8v.5l4 4 4-4zm0-11V4H8v1.5l4 4 4-4z"/>
            </svg>
            <div class="timer-text" id="timerDisplay">30s</div>
        </div>

        <!-- 棋盘 -->
        <div class="board-wrapper">
            <div class="board-frame">
                <canvas id="boardCanvas" style="touch-action: none;"></canvas>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="footer">
            <button class="btn btn-leave" onclick="SFX.click(); leaveGame()">
                <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5v3H3v4h7v3zm9-14H5c-1.1 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>离开
            </button>
            <button class="btn btn-undo" onclick="undo()">
                <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>悔棋
            </button>
            <button class="btn btn-restart" onclick="SFX.click(); restartGame()">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>重玩
            </button>
            <button class="btn btn-setting" onclick="SFX.click(); openDifficulty()">
                <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>难度
            </button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="pveSetupModal">
    <div class="menu-box">
        <div class="menu-item" style="background:#f0ede6; pointer-events:none; font-weight:bold; color:#a84941;">请选择先后手</div>
        <div class="menu-item" onclick="SFX.click(); startPVE(1)">我执黑（先手）</div>
        <div class="menu-item" onclick="SFX.click(); startPVE(2)">我执白（后手）</div>
    </div>
</div>

<div class="modal-overlay" id="confirmModal">
    <div class="confirm-box">
        <div class="confirm-msg" id="confirmMsg">确定要操作吗？</div>
        <div class="confirm-btns">
            <button class="btn-cancel" onclick="SFX.click(); closeConfirm(false)">取消</button>
            <button class="btn-ok" onclick="SFX.click(); closeConfirm(true)">确定</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="difficultyModal">
    <div class="menu-box" id="difficultyList"></div>
</div>

<script>
    /* ================= 音效引擎 ================= */
    const SFX = (() => {
        let ac = null;
        let muted = false;
        try {
            muted = localStorage.getItem('gomoku_muted') === 'true';
        } catch(e){}

        function ctx(){
            if(!ac){
                const AC = window.AudioContext || window.webkitAudioContext;
                if(!AC) return null;
                ac = new AC();
            }
            if(ac.state === 'suspended') ac.resume();
            return ac;
        }
        function tone(freq, dur=0.14, type='sine', vol=0.16, when=0, slideTo=null){
            if (muted) return;
            const c = ctx(); if(!c) return;
            try{
                const t = c.currentTime + when;
                const o = c.createOscillator();
                const g = c.createGain();
                o.type = type;
                o.frequency.setValueAtTime(freq, t);
                if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t + dur);
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                o.connect(g); g.connect(c.destination);
                o.start(t); o.stop(t + dur + 0.03);
            }catch(e){}
        }
        function noise(dur=0.18, vol=0.11, freq=1200){
            if (muted) return;
            const c = ctx(); if(!c) return;
            try{
                const len = Math.floor(c.sampleRate * dur);
                const buf = c.createBuffer(1, len, c.sampleRate);
                const d = buf.getChannelData(0);
                for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
                const src = c.createBufferSource(); src.buffer = buf;
                const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value = freq;
                const g = c.createGain(); g.gain.value = vol;
                src.connect(f); f.connect(g); g.connect(c.destination);
                src.start();
            }catch(e){}
        }
        return {
            setMuted(v){
                muted = v;
                try { localStorage.setItem('gomoku_muted', v ? 'true' : 'false'); } catch(e){}
            },
            isMuted(){ return muted; },
            click(){ tone(640, 0.05, 'triangle', 0.045); },
            correct(){ tone(880,0.09,'sine',0.15); tone(1320,0.15,'sine',0.13,0.07); },
            wrong(){ tone(300, 0.18, 'triangle', 0.07, 0, 180); noise(0.10, 0.025, 400); },
            pop(){ tone(620,0.075,'triangle',0.12,0,1250); },
            win(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.26,'sine',0.15,i*0.095)); },
            lose(){ [420,330,260,175].forEach((f,i)=>tone(f,0.26,'triangle',0.12,i*0.11)); }
        };
    })();

    // 初始化静音按钮状态
    window.addEventListener('DOMContentLoaded', () => {
        const soundBtn = document.getElementById('btnSound');
        soundBtn.innerText = SFX.isMuted() ? '🔇' : '🔊';
        
        soundBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const willMute = !SFX.isMuted();
            SFX.setMuted(willMute);
            soundBtn.innerText = willMute ? '🔇' : '🔊';
            if (!willMute) SFX.click();
        });
    });

    /* ================= 撒花特效 ================= */
    function confetti(){
        const colors = ['#4cc9f0','#f72585','#ffd93d','#06d6a0','#b5179e','#7b61ff','#ff8fab'];
        for(let i=0;i<70;i++){
            const d = document.createElement('div');
            d.className = 'confetti';
            d.style.left = (Math.random()*100) + 'vw';
            d.style.background = colors[i % colors.length];
            d.style.animationDelay = (Math.random()*0.7) + 's';
            d.style.animationDuration = (1.7 + Math.random()*1.5) + 's';
            d.style.width = (6 + Math.random()*7) + 'px';
            d.style.height = (10 + Math.random()*10) + 'px';
            document.body.appendChild(d);
            setTimeout(()=>d.remove(), 3800);
        }
    }

    /* ================= 五子棋核心逻辑 ================= */
    const BOARD_SIZE = 15; 
    let CELL_SIZE = 32;
    let PADDING = 16;
    let CANVAS_SIZE = 0;
    
    const DIFFICULTIES = [
        { id: 'master', name: '天人合一', depth: 4, random: 0 },       
        { id: 'grandmaster', name: '登峰造极', depth: 4, random: 10 },
        { id: 'expert', name: '傲视群雄', depth: 3, random: 20 },      
        { id: 'hard', name: '出神入化', depth: 2, random: 30 },
        { id: 'medium', name: '炉火纯青', depth: 1, random: 100 },     
        { id: 'normal', name: '登堂入室', depth: 1, random: 500 },
        { id: 'easy', name: '初出茅庐', depth: 0, random: 8000 }       
    ];

    let canvas, ctx;
    let board = []; 
    let currentPlayer = 1; 
    let gameOver = false;
    let history = []; 
    let lastMove = null; 
    
    let aiConfig = DIFFICULTIES[6]; 
    let gameMode = 'pve';
    let playerColor = 1; 
    let aiColor = 2;
    
    let previewPos = null; 

    let turnTimer = null;
    let timeLeft = 30;
    let rotationDeg = 0; 

    // 胜利动画相关变量
    let winningCells = [];
    let winAnimStartTime = 0;
    let isWinAnimating = false;

    let confirmCallback = null;
    function showConfirm(msg, callback) {
        document.getElementById('confirmMsg').innerText = msg;
        document.getElementById('confirmModal').classList.add('active');
        confirmCallback = callback;
    }
    function closeConfirm(isOk) {
        document.getElementById('confirmModal').classList.remove('active');
        if (isOk && confirmCallback) confirmCallback();
        confirmCallback = null;
    }

    let toastTimeout = null;
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    window.onload = () => {
        canvas = document.getElementById('boardCanvas');
        ctx = canvas.getContext('2d');
        
        canvas.addEventListener('pointerdown', handleCanvasClick);
        canvas.addEventListener('pointermove', handleMouseMove);
        canvas.addEventListener('pointerleave', () => { previewPos = null; draw(); });

        window.addEventListener('resize', resizeBoard);

        // 绑定遮罩点击关闭弹窗逻辑
        document.getElementById('difficultyModal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
                SFX.click();
            }
        });
        document.getElementById('pveSetupModal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
                SFX.click();
            }
        });
        document.getElementById('confirmModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeConfirm(false); 
                SFX.click();
            }
        });

        renderDifficultyMenu();
    };

    function resizeBoard() {
        if (!document.getElementById('gameUI').classList.contains('active')) return;
        
        const boardWrapper = document.querySelector('.board-wrapper');
        const wrapperWidth = boardWrapper.clientWidth;
        const wrapperHeight = boardWrapper.clientHeight;
        
        if (wrapperWidth === 0 || wrapperHeight === 0) {
            requestAnimationFrame(resizeBoard);
            return;
        }

        const availableSize = Math.min(wrapperWidth, wrapperHeight) - 12; 
        if (availableSize < 100) {
            setTimeout(resizeBoard, 50);
            return;
        }

        CELL_SIZE = Math.floor(availableSize / 15.2);
        if (CELL_SIZE < 10) CELL_SIZE = 10;
        
        PADDING = Math.floor(CELL_SIZE * 0.6);
        CANVAS_SIZE = CELL_SIZE * (BOARD_SIZE - 1) + PADDING * 2;
        
        canvas.width = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;
        canvas.style.width = CANVAS_SIZE + 'px';
        canvas.style.height = CANVAS_SIZE + 'px';
        
        draw();
    }

    function startTurnTimer() {
        clearInterval(turnTimer);
        if (gameOver) return;
        
        timeLeft = 30;
        updateTimerUI();
        
        turnTimer = setInterval(() => {
            timeLeft--;
            updateTimerUI();
            if (timeLeft <= 0) {
                clearInterval(turnTimer);
                handleTimeout();
            }
        }, 1000);
    }

    function updateTimerUI() {
        const timerEl = document.getElementById('timerDisplay');
        const hourglass = document.getElementById('hourglassIcon');
        
        if (!timerEl || !hourglass) return;
        
        timerEl.innerText = timeLeft + 's';
        
        if (timeLeft < 30 && timeLeft >= 0) {
            rotationDeg += 180; 
            hourglass.style.transform = `rotate(${rotationDeg}deg)`;
        }

        if (timeLeft <= 5) {
            timerEl.classList.add('danger');
        } else {
            timerEl.classList.remove('danger');
        }
    }

    function handleTimeout() {
        if (gameOver) return;
        
        let emptyCells = [];
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c] === 0) emptyCells.push({r, c});
            }
        }
        
        if (emptyCells.length > 0) {
            let randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            showToast(`${currentPlayer === 1 ? '黑方' : '白方'} 超时，系统随机落子！`);
            makeMove(randomCell.r, randomCell.c);
        }
    }

    function openPVESetup() {
        document.getElementById('pveSetupModal').classList.add('active');
    }

    function startPVE(color) {
        document.getElementById('pveSetupModal').classList.remove('active');
        playerColor = color;
        aiColor = color === 1 ? 2 : 1;
        startGame('pve');
    }

    function startGame(mode) {
        gameMode = mode;
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('gameUI').classList.add('active');
        
        if (mode === 'pvp') {
            document.querySelector('.btn-setting').style.display = 'none';
            document.getElementById('p2Name').innerText = '白方';
        } else {
            document.querySelector('.btn-setting').style.display = 'flex';
            document.getElementById('p2Name').innerText = aiConfig.name;
        }
        
        initGame();
        
        requestAnimationFrame(() => {
            resizeBoard();
        });
    }

    function leaveGame() {
        showConfirm('确定要离开对局返回主界面吗？', () => {
            clearInterval(turnTimer);
            isWinAnimating = false;
            document.getElementById('gameUI').classList.remove('active');
            document.getElementById('mainMenu').classList.remove('hidden');
        });
    }

    function restartGame() {
        showConfirm('确定要重新开始对局吗？', () => {
            clearInterval(turnTimer);
            initGame();
            requestAnimationFrame(() => resizeBoard()); 
        });
    }

    function initGame() {
        board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
        currentPlayer = 1; 
        gameOver = false;
        history = [];
        lastMove = null;
        previewPos = null;
        
        isWinAnimating = false;
        winningCells = [];

        rotationDeg = 0;
        const hourglass = document.getElementById('hourglassIcon');
        if (hourglass) {
            hourglass.style.transition = 'none'; 
            hourglass.style.transform = 'rotate(0deg)';
            void hourglass.offsetWidth; 
            hourglass.style.transition = 'transform 0.4s ease-in-out';
        }

        updateUI();
        draw();

        startTurnTimer();

        if (gameMode === 'pve' && aiColor === 1) {
            setTimeout(makeAIMove, 500);
        }
    }

    function draw() {
        if (!canvas || canvas.width === 0) return; 

        drawBoard();
        
        const now = performance.now();
        
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c] !== 0) {
                    const isLatest = lastMove && lastMove.r === r && lastMove.c === c;
                    
                    let scale = 1;
                    
                    // 播放胜利动画时，计算缩放比例
                    if (isWinAnimating && winningCells.some(wc => wc.r === r && wc.c === c)) {
                        const t = (now - winAnimStartTime) / 1000;
                        // 周期约 0.4 秒，利用正弦波在 -1 到 1 之间平滑震荡
                        const pulse = Math.sin(t * Math.PI / 0.4); 
                        // 最终大小在 0.95 到 1.05 之间（±5%）
                        scale = 1 + pulse * 0.05; 
                    }

                    drawPiece(c, r, board[r][c], isLatest, scale);
                }
            }
        }
        if (previewPos && board[previewPos.r][previewPos.c] === 0) {
            ctx.globalAlpha = 0.5;
            drawPiece(previewPos.c, previewPos.r, currentPlayer, false);
            ctx.globalAlpha = 1.0;
        }
    }

    function drawBoard() {
        ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE); 
        
        ctx.strokeStyle = 'rgba(80,80,80,0.3)'; 
        ctx.lineWidth = Math.max(1, CELL_SIZE * 0.1);
        ctx.strokeRect(PADDING/2, PADDING/2, CANVAS_SIZE - PADDING, CANVAS_SIZE - PADDING);
        
        ctx.strokeStyle = 'rgba(74, 74, 74, 0.8)'; 
        ctx.lineWidth = Math.max(1, CELL_SIZE * 0.03);
        for (let i = 0; i < BOARD_SIZE; i++) {
            ctx.beginPath(); ctx.moveTo(PADDING, PADDING + i * CELL_SIZE); ctx.lineTo(CANVAS_SIZE - PADDING, PADDING + i * CELL_SIZE); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(PADDING + i * CELL_SIZE, PADDING); ctx.lineTo(PADDING + i * CELL_SIZE, CANVAS_SIZE - PADDING); ctx.stroke();
        }

        const starPoints = [3, 7, 11];
        ctx.fillStyle = '#333';
        starPoints.forEach(x => {
            starPoints.forEach(y => {
                if ((x === 7 && y === 7) || (x === 3 && y === 3) || (x === 11 && y === 3) || (x === 3 && y === 11) || (x === 11 && y === 11)) {
                    ctx.beginPath(); 
                    ctx.arc(PADDING + x * CELL_SIZE, PADDING + y * CELL_SIZE, Math.max(1.5, CELL_SIZE * 0.1), 0, Math.PI * 2); 
                    ctx.fill();
                }
            });
        });
    }

    // 【核心修改点】将基准半径 0.45 缩小 5% 改为 0.4275
    function drawPiece(col, row, player, isLatest, scale = 1) {
        const x = PADDING + col * CELL_SIZE;
        const y = PADDING + row * CELL_SIZE;
        const radius = CELL_SIZE * 0.4275 * scale; // 棋子全局缩小5%

        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.4)'; 
        ctx.shadowBlur = CELL_SIZE * 0.2; 
        ctx.shadowOffsetX = CELL_SIZE * 0.05; 
        ctx.shadowOffsetY = CELL_SIZE * 0.1;
        
        ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = player === 1 ? '#000' : '#fff'; ctx.fill();
        ctx.shadowColor = 'transparent';

        const gradient = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, radius * 0.05, x, y, radius * 1.1);
        if (player === 1) {
            gradient.addColorStop(0, 'rgba(150,150,150,0.8)'); 
            gradient.addColorStop(0.3, '#222'); 
            gradient.addColorStop(1, '#000');
        } else {
            gradient.addColorStop(0, '#ffffff'); 
            gradient.addColorStop(0.6, '#e6e6e6'); 
            gradient.addColorStop(1, '#a0a0a0');
        }
        ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fillStyle = gradient; ctx.fill();

        ctx.beginPath(); ctx.arc(x, y, radius - 1, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.strokeStyle = player === 1 ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.8)';
        ctx.lineWidth = Math.max(1, CELL_SIZE * 0.06); ctx.stroke();

        ctx.beginPath(); 
        ctx.ellipse(x - radius*0.2, y - radius*0.35, radius*0.4, radius*0.2, Math.PI/4, 0, Math.PI*2);
        ctx.fillStyle = player === 1 ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.9)'; ctx.fill();

        // 最新落子红点也应该随比例缩放
        if (isLatest) {
            ctx.beginPath(); ctx.arc(x, y, radius * 0.25, 0, Math.PI * 2); ctx.fillStyle = '#ff3333'; ctx.fill();
            ctx.beginPath(); ctx.arc(x - radius*0.08, y - radius*0.08, radius * 0.08, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fill();
        }
        ctx.restore();
    }

    function handleMouseMove(e) {
        if (e.pointerType === 'touch') return;
        if (gameOver || (gameMode === 'pve' && currentPlayer === aiColor)) return;
        
        const rect = canvas.getBoundingClientRect();
        if (rect.width === 0) return; 

        const c = Math.round(((e.clientX - rect.left) * (canvas.width / rect.width) - PADDING) / CELL_SIZE);
        const r = Math.round(((e.clientY - rect.top) * (canvas.height / rect.height) - PADDING) / CELL_SIZE);
        
        if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === 0) {
            if (!previewPos || previewPos.r !== r || previewPos.c !== c) {
                previewPos = { r, c };
                draw();
            }
        } else {
            previewPos = null;
        }
    }

    function handleCanvasClick(e) {
        if (gameOver || (gameMode === 'pve' && currentPlayer === aiColor)) return;
        
        const rect = canvas.getBoundingClientRect();
        if (rect.width === 0) return; 

        const c = Math.round(((e.clientX - rect.left) * (canvas.width / rect.width) - PADDING) / CELL_SIZE);
        const r = Math.round(((e.clientY - rect.top) * (canvas.height / rect.height) - PADDING) / CELL_SIZE);

        if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === 0) {
            makeMove(r, c);
        }
    }

    function makeMove(r, c) {
        if (gameOver) return;
        clearInterval(turnTimer); 
        
        SFX.pop();

        board[r][c] = currentPlayer;
        lastMove = { r, c };
        history.push({ r, c, player: currentPlayer });
        previewPos = null;
        
        const winCells = checkWin(r, c, currentPlayer);
        if (winCells) {
            gameOver = true;
            
            winningCells = winCells;
            winAnimStartTime = performance.now();
            isWinAnimating = true;
            
            draw();
            
            if (gameMode === 'pvp') {
                SFX.win();
                confetti();
            } else {
                if (currentPlayer === playerColor) {
                    SFX.win();
                    confetti();
                } else {
                    SFX.lose();
                }
            }
            
            requestAnimationFrame(animateWin);
            
            setTimeout(() => { 
                showConfirm(currentPlayer === 1 ? '黑方胜利！' : '白方胜利！', () => {}); 
            }, 1000);
            
            return;
        }

        currentPlayer = currentPlayer === 1 ? 2 : 1;
        updateUI();
        draw();
        
        startTurnTimer(); 

        if (gameMode === 'pve' && currentPlayer === aiColor && !gameOver) {
            setTimeout(makeAIMove, 100);
        }
    }

    function animateWin(now) {
        if (!isWinAnimating) return;
        const elapsed = now - winAnimStartTime;
        
        if (elapsed > 5000) {
            isWinAnimating = false;
            winningCells = [];
            draw(); 
            return;
        }
        draw();
        requestAnimationFrame(animateWin);
    }

    function undo() {
        if (history.length === 0 || gameOver) return;
        clearInterval(turnTimer);
        
        SFX.wrong();

        const steps = (gameMode === 'pve' && history.length >= 2) ? 2 : 1;
        for(let i = 0; i < steps; i++) {
            const last = history.pop();
            if (last) board[last.r][last.c] = 0;
        }
        lastMove = history.length > 0 ? history[history.length - 1] : null;
        currentPlayer = 1; 
        gameOver = false;
        previewPos = null;
        
        isWinAnimating = false;
        winningCells = [];
        
        updateUI();
        draw();
        
        startTurnTimer(); 
    }

    function updateUI() {
        document.getElementById('p1Indicator').className = `player-turn-indicator black ${currentPlayer === 1 ? 'active' : ''}`;
        document.getElementById('p2Indicator').className = `player-turn-indicator white ${currentPlayer === 2 ? 'active' : ''}`;
    }

    function checkWin(r, c, player) {
        const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
        for (let [dr, dc] of dirs) {
            let count = 1;
            let cells = [{r, c}];
            
            for (let i = 1; i <= 4; i++) { 
                const nr = r + dr * i, nc = c + dc * i; 
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === player) {
                    count++; 
                    cells.push({r: nr, c: nc});
                } else break; 
            }
            for (let i = 1; i <= 4; i++) { 
                const nr = r - dr * i, nc = c - dc * i; 
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === player) {
                    count++; 
                    cells.push({r: nr, c: nc});
                } else break; 
            }
            
            if (count >= 5) {
                return cells; 
            }
        }
        return null;
    }

    function renderDifficultyMenu() {
        const list = document.getElementById('difficultyList');
        list.innerHTML = '';
        DIFFICULTIES.forEach(diff => {
            const div = document.createElement('div');
            div.className = `menu-item`;
            div.innerText = diff.name;
            div.onclick = () => {
                SFX.click();
                aiConfig = diff;
                document.getElementById('p2Name').innerText = diff.name;
                document.getElementById('difficultyModal').classList.remove('active');
                renderDifficultyMenu();
                initGame(); 
            };
            if(diff.id === aiConfig.id) {
                div.style.background = '#e6e0d4'; div.style.color = '#a84941'; div.style.fontWeight = 'bold';
                const check = document.createElement('span'); check.innerText = '✓';
                div.appendChild(check);
            }
            list.appendChild(div);
        });
    }

    function openDifficulty() { document.getElementById('difficultyModal').classList.add('active'); }

    function makeAIMove() {
        if (gameOver || currentPlayer !== aiColor) return;
        
        let bestMove = null;
        
        if (history.length === 0) {
            bestMove = { r: 7, c: 7 };
        } else if (aiConfig.depth === 0) {
            bestMove = getEasyMove();
        } else {
            bestMove = getMinimaxMove(aiConfig.depth);
        }
        
        if (bestMove) makeMove(bestMove.r, bestMove.c);
    }

    function getEasyMove() {
        let maxScore = -1;
        let candidates = [];
        
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c] === 0 && hasNeighbor(r, c)) {
                    let myScore = evaluatePoint(r, c, aiColor);
                    let oppScore = evaluatePoint(r, c, playerColor);
                    let score = myScore * 1.0 + oppScore * 0.3; 
                    score += Math.random() * aiConfig.random; 

                    if (score > maxScore) {
                        maxScore = score;
                        candidates = [{ r, c }];
                    } else if (Math.abs(score - maxScore) < 100) {
                        candidates.push({ r, c });
                    }
                }
            }
        }
        return candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : getRandomEmpty();
    }

    function getMinimaxMove(depth) {
        let bestScore = -Infinity;
        let bestMoves = [];
        
        let candidates = getSortedCandidates(aiColor);
        
        for (let move of candidates) {
            board[move.r][move.c] = aiColor;
            
            if (checkWin(move.r, move.c, aiColor)) {
                board[move.r][move.c] = 0;
                return move;
            }
            
            let score = minimax(depth - 1, false, -Infinity, Infinity);
            board[move.r][move.c] = 0;
            
            score += (Math.random() * aiConfig.random);

            if (score > bestScore) {
                bestScore = score;
                bestMoves = [move];
            } else if (Math.abs(score - bestScore) < 10) {
                bestMoves.push(move);
            }
        }
        return bestMoves.length ? bestMoves[Math.floor(Math.random() * bestMoves.length)] : getRandomEmpty();
    }

    function minimax(depth, isMaximizing, alpha, beta) {
        if (depth === 0) return evaluateBoard();

        let player = isMaximizing ? aiColor : playerColor;
        let bestScore = isMaximizing ? -Infinity : Infinity;
        
        let candidates = getSortedCandidates(player).slice(0, 10);

        if (candidates.length === 0) return evaluateBoard();

        for (let move of candidates) {
            board[move.r][move.c] = player;

            if (checkWin(move.r, move.c, player)) {
                board[move.r][move.c] = 0;
                return isMaximizing ? 1000000 + depth * 100 : -1000000 - depth * 100;
            }

            let score = minimax(depth - 1, !isMaximizing, alpha, beta);
            board[move.r][move.c] = 0;

            if (isMaximizing) {
                bestScore = Math.max(bestScore, score);
                alpha = Math.max(alpha, bestScore);
            } else {
                bestScore = Math.min(bestScore, score);
                beta = Math.min(beta, bestScore);
            }
            if (beta <= alpha) break; 
        }
        return bestScore;
    }

    function evaluateBoard() {
        let aiScore = 0;
        let playerScore = 0;
        
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c] === aiColor) aiScore += evaluatePoint(r, c, aiColor);
                else if (board[r][c] === playerColor) playerScore += evaluatePoint(r, c, playerColor);
            }
        }
        return aiScore * 1.2 - playerScore;
    }

    function getSortedCandidates(player) {
        let candidates = [];
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c] === 0 && hasNeighbor(r, c)) {
                    let score = evaluatePoint(r, c, player) + evaluatePoint(r, c, player === 1 ? 2 : 1);
                    candidates.push({ r, c, score });
                }
            }
        }
        return candidates.sort((a, b) => b.score - a.score);
    }

    function evaluatePoint(r, c, player) {
        let score = 0; const dirs = [[1,0], [0,1], [1,1], [1,-1]];
        dirs.forEach(([dr, dc]) => {
            let count = 1; let block = 0; 
            for (let i = 1; i <= 4; i++) {
                const nr = r + dr * i, nc = c + dc * i;
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                    if (board[nr][nc] === player) count++; else if (board[nr][nc] !== 0) { block++; break; } else break;
                } else { block++; break; }
            }
            for (let i = 1; i <= 4; i++) {
                const nr = r - dr * i, nc = c - dc * i;
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                    if (board[nr][nc] === player) count++; else if (board[nr][nc] !== 0) { block++; break; } else break;
                } else { block++; break; }
            }
            if (count >= 5) score += 1000000; 
            else if (count === 4) {
                if (block === 0) score += 100000; 
                else if (block === 1) score += 10000; 
            }
            else if (count === 3) {
                if (block === 0) score += 10000; 
                else if (block === 1) score += 1000; 
            }
            else if (count === 2) {
                if (block === 0) score += 1000; 
                else if (block === 1) score += 100;
            }
        });
        return score;
    }

    function hasNeighbor(r, c) {
        for (let i = -2; i <= 2; i++) {
            for (let j = -2; j <= 2; j++) {
                if (i === 0 && j === 0) continue;
                const nr = r + i, nc = c + j;
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] !== 0) return true;
            }
        }
        return false;
    }

    function getRandomEmpty() {
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) { if (board[r][c] === 0) return { r, c }; }
        }
        return null;
    }
