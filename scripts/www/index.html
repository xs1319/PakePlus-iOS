<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>水墨五子棋</title>
    <style>
        :root {
            --paper-color: #faf9f5;
            --app-bg: #e6e9e4;
            --text-color: #333333;
            --sub-text: #666666;
            --panel-bg: rgba(255, 255, 255, 0.75);
            --panel-border: rgba(0, 0, 0, 0.1);
            --board-frame-bg: rgba(255, 255, 255, 0.52);
            --board-canvas-bg: rgba(255, 255, 255, 0.60);
            --board-line: rgba(74, 74, 74, 0.8);
            --board-border: rgba(80, 80, 80, 0.3);
            --star-color: #333333;
            --sun-red: #eb8c84;
            --ink-mtn-1-top: #777777;
            --ink-mtn-1-mid: #999999;
            --ink-mtn-2-top: #5f5f5f;
            --ink-mtn-2-mid: #888888;
            --ink-mtn-light: #b8b8b8;
            --ink-bamboo: #555555;
            --ink-bird: #666666;
            --ink-river-fill: rgba(130, 150, 165, 0.28);
            --ink-river-stroke: rgba(95, 115, 130, 0.42);
            --btn-leave: rgba(217, 101, 86, 0.9);
            --btn-restart: rgba(142, 97, 189, 0.9);
            --btn-setting: rgba(77, 158, 117, 0.9);
            --btn-theme: rgba(71, 85, 105, 0.9);
            --modal-bg: #fdfcf9;
            --modal-item-hover: #f0ede6;
            --modal-item-active: #e6e0d4;
            --ink-opacity: 0.65;
        }

        body.dark-mode {
            --paper-color: #141b2d;
            --app-bg: #0d121f;
            --text-color: #f1f5f9;
            --sub-text: #cbd5e1;
            --panel-bg: rgba(30, 41, 59, 0.88);
            --panel-border: rgba(226, 232, 240, 0.18);
            --board-frame-bg: rgba(148, 163, 184, 0.46);
            --board-canvas-bg: rgba(51, 65, 85, 0.66);
            --board-line: rgba(241, 245, 249, 0.82);
            --board-border: rgba(241, 245, 249, 0.48);
            --star-color: #f8fafc;
            --sun-red: #f87171;
            --ink-mtn-1-top: #94a3b8;
            --ink-mtn-1-mid: #64748b;
            --ink-mtn-2-top: #cbd5e1;
            --ink-mtn-2-mid: #94a3b8;
            --ink-mtn-light: #94a3b8;
            --ink-bamboo: #cbd5e1;
            --ink-bird: #e2e8f0;
            --ink-river-fill: rgba(148, 185, 225, 0.26);
            --ink-river-stroke: rgba(186, 215, 245, 0.48);
            --modal-bg: #1a2338;
            --modal-item-hover: rgba(255, 255, 255, 0.08);
            --modal-item-active: rgba(148, 163, 184, 0.24);
            --ink-opacity: 0.62;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background-color: #1e293b;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: var(--app-bg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s;
        }
        /* 横屏模式（宽 > 高）自动保持竖屏比例并旋转90度适配，避免被上下压缩成窄条 */
        @media (orientation: landscape) and (min-width: 600px) {
            body.force-portrait-landscape .app-container {
                width: 100vh;
                height: 100vw;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(-90deg);
                transform-origin: center center;
                box-shadow: 0 0 30px rgba(0,0,0,0.45);
            }
        }

        /* 撒花特效 */
        .confetti {
            position: fixed; top: -24px; width: 9px; height: 15px; border-radius: 2px;
            z-index: 2000; pointer-events: none; animation: fall linear forwards;
        }
        @keyframes fall { to { transform: translateY(108vh) rotate(760deg); opacity: .15; } }

        /* --- 1. 主界面 --- */
        #mainMenu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            background-color: #f4f1ea;
            transition: opacity 0.5s ease, background-color 0.3s;
            background-image:
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" preserveAspectRatio="xMidYMid slice"><rect width="600" height="1000" fill="%23f4f1ea"/><path d="M0 700 Q150 600 300 750 T600 700 L600 1000 L0 1000 Z" fill="%23dcd5c6" opacity="0.65"/><path d="M-50 800 Q180 680 380 820 T700 760 L700 1000 L-50 1000 Z" fill="%23c6beac" opacity="0.45"/><circle cx="430" cy="230" r="46" fill="%23d97566" opacity="0.82"/><path d="M260 390 Q310 345 360 390 T460 390" fill="none" stroke="%23333" stroke-width="2" opacity="0.2"/></svg>');
            background-size: cover;
            background-position: center;
        }

        body.dark-mode #mainMenu {
            background-color: #10141c;
            background-image:
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" preserveAspectRatio="xMidYMid slice"><rect width="600" height="1000" fill="%2310141c"/><circle cx="430" cy="230" r="46" fill="%23e06c60" opacity="0.78"/><circle cx="430" cy="230" r="64" fill="%23e06c60" opacity="0.14"/><path d="M260 390 Q310 345 360 390 T460 390" fill="none" stroke="%23cbd5e1" stroke-width="2" opacity="0.22"/><path d="M0 700 Q150 600 300 750 T600 700 L600 1000 L0 1000 Z" fill="%231e293b" opacity="0.85"/><path d="M-50 800 Q180 680 380 820 T700 760 L700 1000 L-50 1000 Z" fill="%23293548" opacity="0.72"/></svg>');
            background-size: cover;
            background-position: center;
        }

        #mainMenu.hidden { opacity: 0; pointer-events: none; }

        /* 主界面左上角与右上角功能图标 */
        .top-left-tools {
            position: absolute;
            top: calc(16px + env(safe-area-inset-top));
            left: 16px;
            display: flex;
            gap: 8px;
            z-index: 20;
        }
        .top-right-tools {
            position: absolute;
            top: calc(16px + env(safe-area-inset-top));
            right: 16px;
            display: flex;
            gap: 8px;
            z-index: 20;
        }
        .icon-btn {
            touch-action: manipulation;
            width: 44px; height: 44px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .icon-btn:active { transform: scale(0.9); }

        .main-title {
            font-family: "STXingkai", "华文行楷", "STKaiti", cursive;
            font-size: 90px; color: #2b2b2b; margin-bottom: 60px;
            text-shadow: 2px 4px 15px rgba(0,0,0,0.1);
            letter-spacing: 15px; writing-mode: vertical-rl; text-orientation: upright;
            z-index: 10;
            transition: color 0.3s;
        }
        body.dark-mode .main-title {
            color: #f1f5f9;
            text-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
        }

        .menu-btn {
            touch-action: manipulation;
            width: 220px; height: 60px; margin: 15px 0;
            background: rgba(255, 255, 255, 0.75);
            border: 2px solid #3e3e3e; border-radius: 30px;
            font-size: 22px; font-family: "STKaiti", serif;
            color: #3e3e3e; font-weight: bold; cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            transition: all 0.2s; backdrop-filter: blur(5px); z-index: 10;
        }
        .menu-btn:active { background: #3e3e3e; color: #fff; transform: scale(0.95); }
        body.dark-mode .menu-btn {
            background: rgba(30, 41, 82, 0.75);
            border-color: rgba(148, 163, 184, 0.4);
            color: #e8ecf7;
        }
        body.dark-mode .menu-btn:active {
            background: #3b82f6;
            color: #fff;
        }

        .copyright {
            position: absolute; bottom: calc(30px + env(safe-area-inset-bottom)); font-size: 14px; color: #888;
            letter-spacing: 2px; font-family: Arial, sans-serif; z-index: 10;
        }

        /* --- 2. 游戏界面 --- */
        #gameUI {
            display: none; flex-direction: column; width: 100%; height: 100%;
            padding: calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));
            position: relative;
            background-color: var(--paper-color);
            transition: background-color 0.3s;
            justify-content: space-between;
        }
        #gameUI.active { display: flex; }

        /* 水墨背景 */
        .artwork-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: var(--ink-opacity);
            transition: opacity 0.3s;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.4) 0%, transparent 100%),
                linear-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        .artwork-bg svg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        /* ================= 上下完全镜像玩家控制台 ================= */
        .side-control-group {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }
        /* 双人模式下黑方整组旋转180度，实现与白方完全面对面镜像（含离开、重玩、难度、玩家栏） */
        .side-control-group.top-group {
            transform: rotate(180deg);
        }
        /* 人机模式下：上方固定为“人机”区域，文字保持正常正向不旋转，且隐藏所有功能按钮和悔棋 */
        #gameUI.pve-mode .side-control-group.top-group {
            transform: none;
        }
        #gameUI.pve-mode .side-control-group.top-group .footer,
        #gameUI.pve-mode #btnUndoTop {
            display: none !important;
        }
        #gameUI.pve-mode .board-timer-zone.top-timer-zone {
            transform: none;
        }
        /* 人机状态栏正中间难度等级徽标（字号放大50%+至20px，颜色与状态栏反色形成高对比） */
        .ai-diff-center {
            display: none;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 5px 15px;
            border-radius: 14px;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            white-space: nowrap;
            pointer-events: none;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.22);
        }
        #gameUI.pve-mode .ai-diff-center {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* 状态栏正中间“对弈记录”按钮（人机模式我方、双人模式双方均显示） */
        .player-record-center {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            height: 36px;
            padding: 0 14px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1px;
            white-space: nowrap;
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.2s;
            touch-action: manipulation;
        }
        .player-record-center:active {
            transform: translate(-50%, -50%) scale(0.94);
        }
        #gameUI.pve-mode #topZone .player-record-center {
            display: none !important;
        }

        /* 可点击切换用户的头像样式 */
        .avatar.clickable-avatar {
            cursor: pointer;
            position: relative;
            transition: transform 0.15s, box-shadow 0.2s;
        }
        .avatar.clickable-avatar:active {
            transform: scale(0.9);
        }
        #gameUI.pve-mode #topZone .avatar {
            cursor: default;
        }

        /* 主界面添加用户按钮（与人机对战/双人对战同风格略紧凑） */
        .menu-btn.btn-add-user {
            width: 220px;
            height: 52px;
            margin: 12px 0;
            font-size: 19px;
            border-style: dashed;
        }

        /* 用户管理与切换弹窗样式 */
        .user-modal-box {
            background: var(--modal-bg);
            width: 88%;
            max-width: 340px;
            max-height: 75vh;
            border-radius: 16px;
            box-shadow: 0 15px 38px rgba(0,0,0,0.32);
            border: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: popIn 0.2s ease-out;
        }
        .user-input-row {
            padding: 12px 14px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--panel-border);
            background: var(--modal-item-hover);
        }
        .user-input-row input {
            flex: 1;
            height: 38px;
            padding: 0 12px;
            border-radius: 19px;
            border: 1px solid var(--panel-border);
            background: var(--modal-bg);
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }
        .user-input-row button {
            height: 38px;
            padding: 0 16px;
            border-radius: 19px;
            border: none;
            background: #4d9e75;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        .user-list {
            padding: 10px 14px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .user-item {
            padding: 10px 12px;
            border-radius: 12px;
            background: var(--modal-item-hover);
            border: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .user-item.selected {
            background: var(--modal-item-active);
            border-color: #d96556;
        }
        .user-item.occupied {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .user-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .user-badge-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 900;
            color: #fff;
            flex-shrink: 0;
        }
        .user-item-name {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-item-tag {
            font-size: 12px;
            font-weight: 700;
            color: #d96556;
            white-space: nowrap;
        }
        .user-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .user-edit-btn {
            padding: 4px 10px;
            border-radius: 10px;
            border: none;
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .user-del-btn {
            padding: 4px 10px;
            border-radius: 10px;
            border: none;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        /* 确保确认弹窗永远高于用户管理弹窗 */
        #confirmModal {
            z-index: 1300;
        }
        /* 骰子提示浮标（棋盘正上方或两侧提示） */
        .dice-hint-banner {
            position: absolute;
            left: 50%;
            bottom: 10px;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.78);
            color: #fff;
            padding: 5px 14px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 700;
            pointer-events: none;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            z-index: 15;
            display: none;
        }
        .dice-hint-banner.show {
            display: block;
        }

        /* 执黑状态栏统一主题（黑底白字） - 高优先级覆盖默认 top-zone / bottom-zone */
        .player-zone.top-zone.side-black-theme,
        .player-zone.bottom-zone.side-black-theme,
        body.dark-mode .player-zone.top-zone.side-black-theme,
        body.dark-mode .player-zone.bottom-zone.side-black-theme {
            background: linear-gradient(135deg, rgba(42, 42, 46, 0.94), rgba(18, 18, 22, 0.94)) !important;
            color: #ffffff !important;
            border-color: rgba(255, 255, 255, 0.18) !important;
        }
        .player-zone.side-black-theme .avatar {
            border-color: rgba(255, 255, 255, 0.65);
            background: #e6d5c3 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="25" fill="%235c4b40"/><path d="M15 90 Q50 50 85 90" fill="%235c4b40"/></svg>') center/cover;
        }
        /* 黑底状态栏内反色标签：白底黑字 */
        .player-zone.side-black-theme .ai-diff-center {
            background: #ffffff;
            color: #111111;
            border: 1.5px solid #cbd5e1;
        }
        .player-zone.side-black-theme .player-record-center {
            background: #ffffff;
            color: #111111;
            border: 1.5px solid #cbd5e1;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
        }

        /* 执白状态栏统一主题（白底黑字） - 高优先级覆盖默认 top-zone / bottom-zone */
        .player-zone.top-zone.side-white-theme,
        .player-zone.bottom-zone.side-white-theme,
        body.dark-mode .player-zone.top-zone.side-white-theme,
        body.dark-mode .player-zone.bottom-zone.side-white-theme {
            background: linear-gradient(135deg, rgba(252, 252, 252, 0.94), rgba(226, 232, 240, 0.94)) !important;
            color: #0f172a !important;
            border-color: rgba(15, 23, 42, 0.14) !important;
        }
        .player-zone.side-white-theme .avatar {
            border-color: rgba(15, 23, 42, 0.2);
            background: #e6d5c3 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="25" fill="%238b7355"/><path d="M15 90 Q50 50 85 90" fill="%238b7355"/></svg>') center/cover;
        }
        /* 白底状态栏内反色标签：难度黑底白字；对弈记录采用柔和高级灰底白字 */
        .player-zone.side-white-theme .ai-diff-center {
            background: #111111;
            color: #ffffff;
            border: 1.5px solid #334155;
        }
        .player-zone.side-white-theme .player-record-center {
            background: #64748b;
            color: #ffffff;
            border: 1.5px solid #475569;
            box-shadow: 0 3px 10px rgba(71, 85, 105, 0.25);
        }

        /* 对弈记录弹窗样式 */
        .record-modal-box {
            background: var(--modal-bg);
            width: 90%;
            max-width: 360px;
            max-height: 75vh;
            border-radius: 16px;
            box-shadow: 0 15px 38px rgba(0,0,0,0.32);
            border: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: popIn 0.2s ease-out;
        }
        .record-header {
            padding: 14px 16px;
            font-size: 17px;
            font-weight: 800;
            color: var(--text-color);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--modal-item-hover);
        }
        .record-summary {
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 700;
            color: var(--sub-text);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
        }
        .record-list {
            padding: 10px 14px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .record-empty {
            text-align: center;
            padding: 32px 12px;
            color: var(--sub-text);
            font-size: 14px;
        }
        .record-card {
            padding: 10px 12px;
            border-radius: 10px;
            background: var(--modal-item-hover);
            border: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 13px;
            color: var(--text-color);
        }
        .record-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
        }
        .record-badge {
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
        }
        .record-badge.win { background: rgba(16, 185, 129, 0.18); color: #10b981; }
        .record-badge.lose { background: rgba(239, 68, 68, 0.18); color: #ef4444; }

        /* 棋盘上下两侧空白正中间区域的沙漏容器（严格处于功能按钮与棋盘边缘的正中间） */
        .board-timer-zone {
            position: relative;
            z-index: 10;
            width: 100%;
            flex: 1;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;

        .hourglass-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 20px;

            color: var(--text-color);

            -webkit-backdrop-filter: blur(6px);
            transition: all 0.25s;

        .hourglass-box.low {
            border-color: rgba(239, 68, 68, 0.8);
            background: rgba(239, 68, 68, 0.18);
            animation: pulseT 0.6s ease-in-out infinite;
        }
        @keyframes pulseT {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* 提取自附件的沙漏样式 */
        .hourglass-svg {
            width: 32px;
            height: 32px;
            animation: hgSpin 2s linear infinite;
            transform-origin: 50% 50%;
            filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.45));
            display: block;
            flex-shrink: 0;

        @keyframes hgSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }

        }
        .hourglass-box.low .timer-num {
            color: #ef4444;
        }

        /* 悔棋按钮样式：悔棋（3） | 黑方白底黑字，白方黑底白字 */
        .btn-undo-mirror {
            height: 38px;
            padding: 0 13px;
            border-radius: 19px;
            font-size: 14px;
            font-weight: 800;

        .btn-undo-mirror:active:not(.disabled) {

        .btn-undo-mirror.disabled {
            opacity: 0.38;
            cursor: not-allowed;

        /* 黑方白底黑字 */
        .btn-undo-black {
            background: #ffffff;
            color: #111111;
            border: 1.5px solid #cbd5e1;

        /* 白方黑底白字 */
        .btn-undo-white {
            background: #111111;
            color: #ffffff;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.22);

        /* 棋盘区域（紧贴棋盘大小，上下剩余空间平均分给两侧沙漏居中区） */

            width: 100%; overflow: hidden;
        }

            transition: background-color 0.3s;
        }

        canvas {
            background-color: var(--board-canvas-bg);
            display: block; cursor: pointer; border-radius: 5px;
            touch-action: none;
            transition: background-color 0.3s, backdrop-filter 0.25s;
        }
        canvas.dice-stage-blur {
            background: rgba(8, 11, 18, 0.56) !important;
            backdrop-filter: blur(1.5px) saturate(110%);
            -webkit-backdrop-filter: blur(1.5px) saturate(110%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.26), inset 0 -1px 0 rgba(0, 0, 0, 0.45);
        }
        .board-frame.dice-stage-frame {
            background: rgba(10, 14, 22, 0.34) !important;
            border-color: rgba(255, 255, 255, 0.24) !important;
            backdrop-filter: blur(1.5px);
            -webkit-backdrop-filter: blur(1.5px);
        }

        /* 通用功能栏（上下镜像共用） */
        .footer {
            position: relative; z-index: 10;
            display: flex; justify-content: space-between; gap: 8px;
            flex-shrink: 0;
        }
        .btn {
            flex: 1; height: 38px; border-radius: 19px; border: none; color: white;
            font-size: 14px; font-weight: bold; display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.15), inset 0 2px 4px rgba(255,255,255,0.25);

            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.95); }
        .btn svg { width: 17px; height: 17px; margin-right: 4px; fill: white; }
        .btn-leave { background: var(--btn-leave); }
        .btn-pause { background: rgba(217, 119, 6, 0.92); display: none; }
        .btn-pause.paused { background: rgba(16, 185, 129, 0.92); }
        .btn-restart { background: var(--btn-restart); }
        .btn-setting { background: var(--btn-setting); }
        .btn-theme { background: var(--btn-theme); flex: 0 0 46px; padding: 0; font-size: 18px; }

        /* 暂停状态棋盘遮罩提示（防止暂停时偷看思考） */
        .pause-overlay {
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border-radius: 5px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #ffffff;
            z-index: 25;
            cursor: pointer;
        }
        .pause-overlay.active {
            display: flex;
        }
        .pause-overlay-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
        }
        .pause-overlay-sub {
            font-size: 13px;
            opacity: 0.85;
        }

        /* 轻提示 Toast（单屏 / 用户专属区域） */
        .toast {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.85); color: white; padding: 10px 20px;
            border-radius: 20px; font-size: 14px; font-weight: bold; z-index: 1400;
            opacity: 0; transition: opacity 0.25s; pointer-events: none;
            white-space: nowrap; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .toast.top-oriented {
            top: 24%;
            transform: translate(-50%, -50%) rotate(180deg);
        }
        .toast.bottom-oriented {
            top: 76%;
            transform: translate(-50%, -50%);
        }
        .toast.show { opacity: 1; }

        /* 双屏对称镜像 Toast（仅用于非用户触发的系统/对局提示） */
        .toast-mirror {
            position: absolute; left: 50%;
            background: rgba(15, 23, 42, 0.85); color: white; padding: 9px 18px;
            border-radius: 20px; font-size: 13px; font-weight: bold; z-index: 1400;
            opacity: 0; transition: opacity 0.25s; pointer-events: none;
            white-space: nowrap; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            display: none;
        }
        .toast-mirror.top-mirror {
            top: 26%;
            transform: translate(-50%, -50%) rotate(180deg);
        }
        .toast-mirror.bottom-mirror {
            top: 74%;
            transform: translate(-50%, -50%);
        }
        .toast-mirror.show {
            display: block;
            opacity: 1;
        }

        /* 弹窗样式 */
        .modal-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45); display: none; justify-content: center; align-items: center;
            z-index: 1000; backdrop-filter: blur(5px);
        }
        .modal-overlay.active { display: flex; }

        .confirm-box {
            background: var(--modal-bg); width: 280px; border-radius: 14px; padding: 25px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid var(--panel-border);
            animation: popIn 0.2s ease-out;
        }
        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .confirm-msg { font-size: 18px; color: var(--text-color); margin-bottom: 25px; font-weight: bold; }
        .confirm-btns { display: flex; gap: 15px; }
        .confirm-btns button {
            flex: 1; padding: 10px 0; border-radius: 20px; border: none; font-size: 16px; cursor: pointer; font-weight: bold;
        }
        .btn-cancel { background: rgba(148, 163, 184, 0.25); color: var(--text-color); }
        .btn-ok { background: #4d9e75; color: #fff; }

        .menu-box {
            background: var(--modal-bg); border-radius: 12px; width: 260px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25); overflow: hidden; border: 1px solid var(--panel-border);
            animation: slideDown 0.2s ease-out;
        }
        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .menu-item {
            padding: 15px 20px; font-size: 18px; color: var(--text-color); border-bottom: 1px solid var(--panel-border);
            text-align: center; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            transition: background 0.2s;
        }
        .menu-item:hover { background: var(--modal-item-hover); }
    </style>
</head>

<!-- 强制防缩放拦截 -->
<script>
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) { event.preventDefault(); }
        lastTouchEnd = now;
    }, false);
    document.addEventListener('touchmove', function (e) {
        if (e.touches.length > 1) { e.preventDefault(); }
    }, { passive: false });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
</script>

<script>
    /* ================= 跨关机重启三重持久化存储引擎 (IndexedDB + LocalStorage + Storage.persist) ================= */
    const PermanentStore = (() => {
        const DB_NAME = 'GomokuPermanentDB_v1';
        const STORE_NAME = 'kv_store';
        const SYNC_KEYS = [
            'gomoku_users_list_v2',
            'gomoku_pve_user_records_v1',
            'gomoku_pvp_battle_records_v1',
            'gomoku_active_profile_v1',
            'gomoku_theme_dark',
            'gomoku_muted'
        ];
        let dbInstance = null;

        // 向系统申请持久化存储权限（防止 iOS Safari / 手机浏览器在关机重启或空间紧张时自动清理数据）
        function requestSystemPersistence() {
            try {
                if (navigator.storage && typeof navigator.storage.persist === 'function') {
                    navigator.storage.persist().catch(() => {});
                }
            } catch (e) {}
        }

        function openDB() {
            return new Promise((resolve) => {
                if (dbInstance) return resolve(dbInstance);
                if (typeof indexedDB === 'undefined') return resolve(null);
                try {
                    const req = indexedDB.open(DB_NAME, 1);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            db.createObjectStore(STORE_NAME);
                        }
                    };
                    req.onsuccess = (e) => {
                        dbInstance = e.target.result;
                        resolve(dbInstance);
                    };
                    req.onerror = () => resolve(null);
                } catch (e) {
                    resolve(null);
                }
            });
        }

        async function idbGet(key) {
            const db = await openDB();
            if (!db) return null;
            return new Promise((resolve) => {
                try {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const req = store.get(key);
                    req.onsuccess = () => resolve(req.result !== undefined ? req.result : null);
                    req.onerror = () => resolve(null);
                } catch (e) {
                    resolve(null);
                }
            });
        }

        async function idbSet(key, val) {
            const db = await openDB();
            if (!db) return;
            return new Promise((resolve) => {
                try {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    store.put(val, key);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => resolve();
                } catch (e) {
                    resolve();
                }
            });
        }

        function setItem(key, val) {
            const strVal = typeof val === 'string' ? val : JSON.stringify(val);
            try { localStorage.setItem(key, strVal); } catch (e) {}
            idbSet(key, strVal);
        }

        function getItem(key) {
            try {
                const v = localStorage.getItem(key);
                if (v !== null) return v;
            } catch (e) {}
            return null;
        }

        // 启动时双向校验恢复：若 localStorage 被系统清理则从 IndexedDB 无损恢复；若 IndexedDB 缺失则从 localStorage 补全
        async function hydrateAll(onHydrated) {
            requestSystemPersistence();
            let restoredAny = false;
            for (const key of SYNC_KEYS) {
                let lsVal = null;
                try { lsVal = localStorage.getItem(key); } catch (e) {}
                const dbVal = await idbGet(key);

                if ((lsVal === null || lsVal === '') && dbVal !== null && dbVal !== '') {
                    try { localStorage.setItem(key, dbVal); } catch (e) {}
                    restoredAny = true;
                } else if (lsVal !== null && lsVal !== '' && (dbVal === null || dbVal !== lsVal)) {
                    await idbSet(key, lsVal);
                }
            }
            if (typeof onHydrated === 'function') {
                onHydrated(restoredAny);
            }
        }

        return { setItem, getItem, hydrateAll, requestSystemPersistence };
    })();

    /* ================= 主题切换系统（提取自附件主题功能） ================= */
    const THEME_KEY = 'gomoku_theme_dark';
    let canvas = null, ctx = null;

    function applyTheme(isDark) {
        document.body.classList.toggle('dark-mode', isDark);
        const icon = isDark ? '☀️' : '🌙';
        const menuBtn = document.getElementById('btnThemeMenu');
        if (menuBtn) menuBtn.textContent = icon;
        PermanentStore.setItem(THEME_KEY, isDark ? '1' : '0');
        if (canvas && ctx && typeof draw === 'function') draw();
    }

    function toggleTheme() {
        const isDark = !document.body.classList.contains('dark-mode');
        applyTheme(isDark);
    }

    (function initTheme() {
        let saved = '0';
        try { saved = localStorage.getItem(THEME_KEY) || '0'; } catch (e) {}
        applyTheme(saved === '1');
    })();

    /* ================= 音效引擎 ================= */
    const SFX = (() => {
        let ac = null;
        let muted = false;
        try {
            muted = localStorage.getItem('gomoku_muted') === 'true';
        } catch(e){}

        function ctx(){
            if(!ac){
                const AC = window.AudioContext || window.webkitAudioContext;
                if(!AC) return null;
                ac = new AC();
            }
            if(ac.state === 'suspended') ac.resume();
            return ac;
        }
        function tone(freq, dur=0.14, type='sine', vol=0.16, when=0, slideTo=null){
            if (muted) return;
            const c = ctx(); if(!c) return;
            try{
                const t = c.currentTime + when;
                const o = c.createOscillator();
                const g = c.createGain();
                o.type = type;
                o.frequency.setValueAtTime(freq, t);
                if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t + dur);
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                o.connect(g); g.connect(c.destination);
                o.start(t); o.stop(t + dur + 0.03);
            }catch(e){}
        }
        function noise(dur=0.18, vol=0.11, freq=1200){
            if (muted) return;
            const c = ctx(); if(!c) return;
            try{
                const len = Math.floor(c.sampleRate * dur);
                const buf = c.createBuffer(1, len, c.sampleRate);
                const d = buf.getChannelData(0);
                for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
                const src = c.createBufferSource(); src.buffer = buf;
                const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value = freq;
                const g = c.createGain(); g.gain.value = vol;
                src.connect(f); f.connect(g); g.connect(c.destination);
                src.start();
            }catch(e){}
        }
        return {
            setMuted(v){
                muted = v;
                PermanentStore.setItem('gomoku_muted', v ? 'true' : 'false');
            },
            isMuted(){ return muted; },
            click(){ tone(640, 0.05, 'triangle', 0.045); },
            correct(){ tone(880,0.09,'sine',0.15); tone(1320,0.15,'sine',0.13,0.07); },
            wrong(){ tone(300, 0.18, 'triangle', 0.07, 0, 180); noise(0.10, 0.025, 400); },
            pop(){ tone(620,0.075,'triangle',0.12,0,1250); },
            win(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.26,'sine',0.15,i*0.095)); },
            lose(){ [420,330,260,175].forEach((f,i)=>tone(f,0.26,'triangle',0.12,i*0.11)); }
        };
    })();

    // 初始化顶部按钮事件
    window.addEventListener('DOMContentLoaded', () => {
        const soundBtn = document.getElementById('btnSound');
        soundBtn.innerText = SFX.isMuted() ? '🔇' : '🔊';

        soundBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const willMute = !SFX.isMuted();
            SFX.setMuted(willMute);
            soundBtn.innerText = willMute ? '🔇' : '🔊';
            if (!willMute) SFX.click();
        });

        const themeMenuBtn = document.getElementById('btnThemeMenu');
        themeMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            SFX.click();
            toggleTheme();
        });
    });

    /* ================= 撒花特效 ================= */
    function confetti(){
        const colors = ['#4cc9f0','#f72585','#ffd93d','#06d6a0','#b5179e','#7b61ff','#ff8fab'];
        for(let i=0;i<70;i++){
            const d = document.createElement('div');
            d.className = 'confetti';
            d.style.left = (Math.random()*100) + 'vw';
            d.style.background = colors[i % colors.length];
            d.style.animationDelay = (Math.random()*0.7) + 's';
            d.style.animationDuration = (1.7 + Math.random()*1.5) + 's';

        if (!document.getElementById('gameUI').classList.contains('active')) return;

        const gameUI = document.getElementById('gameUI');
        const topGroup = document.querySelector('.top-group');
        const bottomGroup = document.querySelector('.bottom-group');

        const forcedPortrait = isLandscapeForcedPortrait();
        const containerW = forcedPortrait ? window.innerHeight : gameUI.clientWidth;
        const containerH = forcedPortrait ? window.innerWidth : gameUI.clientHeight;

        const uiWidth = containerW - 12; // 占满屏幕宽度，仅保留极窄外框边距
        const topH = topGroup.offsetHeight || 102;
        const bottomH = bottomGroup.offsetHeight || 102;
        // 预留上下控制组 + 两侧沙漏区最小空间（各46px）
        const uiHeight = containerH - topH - bottomH - 16 - 92;

        if (uiWidth <= 0 || uiHeight <= 0) {
            requestAnimationFrame(resizeBoard);
            return;
        }

        const availableSize = Math.min(uiWidth, uiHeight) - 8;
        if (availableSize < 100) {
            setTimeout(resizeBoard, 50);
            return;
        }

        CELL_SIZE = Math.floor(availableSize / 15.1);
        if (CELL_SIZE < 10) CELL_SIZE = 10;

        PADDING = Math.floor(CELL_SIZE * 0.55);
        CANVAS_SIZE = CELL_SIZE * (BOARD_SIZE - 1) + PADDING * 2;

        const dpr = Math.min(window.devicePixelRatio || 1, 3);
        canvas.width = Math.round(CANVAS_SIZE * dpr);
        canvas.height = Math.round(CANVAS_SIZE * dpr);
        canvas.style.width = CANVAS_SIZE + 'px';
        canvas.style.height = CANVAS_SIZE + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    function getTargetEulerForFace(val) {
        const quarterTurn = Math.floor(Math.random() * 4) * (Math.PI / 2);
        const yaw = quarterTurn + (Math.random() - 0.5) * 0.08;
        switch (val) {
            case 1: return { rx: 0,            ry: 0,            rz: yaw };
            case 2: return { rx: 0,            ry: -Math.PI / 2, rz: yaw };
            case 3: return { rx: Math.PI,      ry: 0,            rz: yaw };
            case 4: return { rx: 0,            ry: Math.PI / 2,  rz: yaw };
            case 5: return { rx: Math.PI / 2,  ry: 0,            rz: yaw };
            case 6: return { rx: -Math.PI / 2, ry: 0,            rz: yaw };
        }
        return { rx: 0, ry: 0, rz: 0 };
    }

    function rotateVec3(vec, rx, ry, rz) {
        let [x, y, z] = vec;
        let y1 = y * Math.cos(rx) - z * Math.sin(rx);
        let z1 = y * Math.sin(rx) + z * Math.cos(rx);
        y = y1; z = z1;

        let x2 = x * Math.cos(ry) + z * Math.sin(ry);
        let z2 = -x * Math.sin(ry) + z * Math.cos(ry);
        x = x2; z = z2;

        let x3 = x * Math.cos(rz) - y * Math.sin(rz);
        let y3 = x * Math.sin(rz) + y * Math.cos(rz);
        return [x3, y3, z];
    }
