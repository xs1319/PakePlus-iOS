  砌体： ${inp.priceLabMasonry}元/块
【材料费】
${matSection}【机械费】
  长臂挖机： ${inp.priceMachExc}元/m³
  土方外运： ${inp.priceMachTrans}元/m³
【费率】
  措施费率： ${inp.measureRate}%
  管理费： ${inp.manageRate}%
  利润比率： ${inp.profitRate}% 
  增值税率： ${inp.taxRate}%

===================
四、工程量统计
===================
砖砌体： ${(res.V_mortar !== undefined ? (parseFloat(res.V_mortar) + 0).toFixed(2) : '0.00')} m³
模板： ${(res.S||0).toFixed(2)} m²
钢筋： ${Math.round(res.G||0)} kg
混凝土： ${(res.V||0).toFixed(2)} m³
长臂挖机： ${vMach.toFixed(2)} m³
土方外运： ${(res.Vsoil||0).toFixed(2)} m³

===================
五、费用明细统计
===================
${feeSection}`;
    }

    window.copyModalData = function(btn) {
      const type = window.currentModalType;
      let text = '';
      try {
        text = buildModalText(type);
      } catch(e) { 
        console.error('生成复制内容失败:', e);
        text = '复制内容生成失败：' + (e && e.message ? e.message : e); 
      }
      
      doCopy(text).then(success => {
        if (btn) {
          const orig = btn.innerText;
          btn.innerText = success ? '已复制' : '复制失败';
          btn.disabled = true;
          setTimeout(() => { btn.innerText = orig; btn.disabled = false; }, 1500);
        }
        if (!success) {
          showManualCopyModal(text);
        }
      });
    };

    function buildModalText(type) {
      const wellCodeWithMode = getWellCodeWithMode();
      const sizeInfo = getSizeInfo();
      let text = `【沉井编号：${wellCodeWithMode}】\n沉井尺寸：${sizeInfo}\n\n`;
      
      if(type === 'quantitySummary') {
        text += `═══════════════════════════════\n一、工程量统计\n═══════════════════════════════\n\n`;
        
        if (globalCalcData.masonry.total > 0) {
          const masFiltered = globalCalcData.masonry.filter(it => parseFloat(it.res) > 0);
          if (masFiltered.length > 0) {
            text += `【砖砌体工程】\n\n`;
            masFiltered.forEach((it, i) => {
              const parts = it.formula.split('<br>');
              text += `  ${i+1}. ${it.part}\n`;
              if (parts.length >= 2) {
                const desc = parts[0].replace(/^说明:\s*/, '').trim();
                text += `     说明：${desc}\n`;
                let fmlLine = '';
                for (let k = 1; k < parts.length; k++) {
                  if (parts[k].indexOf('公式:') === 0) {
                    fmlLine = parts[k].replace(/^公式:\s*/, '').trim();
                  } else {
                    text += `     ${parts[k].trim()}\n`;
                  }
                }
                if (fmlLine) text += `     公式：${fmlLine}\n`;
              } else {
                text += `     公式：${it.formula.replace(/<br>/g, '\n     ')}\n`;
              }
              text += `\n`;
            });
            const brickCount = globalCalcData.cost && globalCalcData.cost.Q ? globalCalcData.cost.Q : 0;
            text += `  ☆ 小计：砖块总量 ${brickCount} 块\n\n`;
          }
        }

        const tplFiltered = globalCalcData.template.filter(it => parseFloat(it.res) > 0);
        if (tplFiltered.length > 0) {
          text += `【模板工程】\n\n`;
          tplFiltered.forEach((it, i) => {
            const parts = it.formula.split('<br>');
            const desc = parts[0] ? parts[0].replace(/^说明:\s*/, '').trim() : '';
            let fml = parts[1] ? parts[1].replace(/^公式:\s*/, '').trim() : '';
            text += `  ${i+1}. ${it.part}\n     说明：${desc}\n     公式：${fml}\n\n`;
          });
          text += `  ☆ 小计：模板总面积 ${globalCalcData.template.total} m²\n\n`;
        }
        
        if (globalCalcData.rebar.total > 0) {
          text += `【钢筋工程】\n\n`;
          const rbp = globalCalcData.rebarByPart;
          ['刃脚', '井壁', '层间搭接', '底板', '圈梁'].forEach(name => {
            const g = rbp[name];
            if (g && g.total > 0 && g.items.length > 0) {
              const specStr = g.items.map(it => {
                const simpleName = extractSimpleName(it.name, name);
                return it.sp > 0 ? `${simpleName}Φ${it.dia}@${it.sp}` : `${simpleName}Φ${it.dia}`;
              }).join('；') + '；';
              const descStr = g.items.map(it => {
                const simpleName = extractSimpleName(it.name, name);
                return `${simpleName}（${it.weight.toFixed(1)} kg）`;
              }).join('+');
              const fmlStr = g.items.map(it => `${it.weight.toFixed(1)} kg`).join('+') + '=' + g.total.toFixed(1) + ' kg';
              text += `  ${name}\n     钢筋规格：${specStr}\n     说明：${descStr}\n     公式：${fmlStr}\n\n`;
            }
          });
          text += `  各型号钢筋合计（含损耗）：\n`;
          for(let d in globalCalcData.rebarSum) {
            if (globalCalcData.rebarSum[d] > 0) {
              text += `     Φ${d}：${(globalCalcData.rebarSum[d]/1000).toFixed(3)} t\n`;
            }
          }
          text += `  ☆ 小计：钢筋总重量 ${(globalCalcData.rebar.total/1000).toFixed(3)} t\n\n`;
        }
        
        const concFiltered = globalCalcData.concrete.filter(it => parseFloat(it.res) > 0);
        if (concFiltered.length > 0) {
          text += `【混凝土工程】\n\n`;
          concFiltered.forEach((it, i) => {
            const parts = it.formula.split('<br>');
            const desc = parts[0] ? parts[0].replace(/^说明:\s*/, '').trim() : '';
            let fml = parts[1] ? parts[1].replace(/^公式:\s*/, '').trim() : '';
            text += `  ${i+1}. ${it.part}\n     说明：${desc}\n     公式：${fml}\n\n`;
          });
          text += `  ☆ 小计：混凝土总方量 ${globalCalcData.concrete.total} m³\n\n`;
        }
        
        const ei = globalCalcData.earthworkInfo || {};
        if ((ei.Vmach || 0) > 0) {
          text += `【机械工程量】\n\n`;
          text += `  长臂挖机下沉深度\n     说明：机械下沉深度 = 总深度 − 开挖深度\n     公式：${(ei.totalDepth||0).toFixed(2)} − ${(ei.excavDepth||0).toFixed(2)} = ${(ei.machDepth||0).toFixed(2)} m\n\n`;
          text += `  长臂挖机工程量\n     说明：圆柱体积 = π × (外径/2)² × 机械下沉深度\n     公式：π × (${((ei.extD||0)/2).toFixed(2)})² × ${(ei.machDepth||0).toFixed(2)} = ${(ei.Vmach||0).toFixed(2)} m³\n\n`;
          text += `  ☆ 小计：机械工程量 ${(ei.Vmach||0).toFixed(2)} m³\n\n`;
        }
        
        if (globalCalcData.earthwork.total > 0) {
          text += `【土方工程量】\n\n`;
          const earthFiltered = globalCalcData.earthwork.filter(it => !it.res || parseFloat(it.res) > 0);
          earthFiltered.forEach((it, i) => {
            const parts = it.formula.split('<br>');
            const desc = parts[0] ? parts[0].replace(/^说明:\s*/, '').trim() : '';
            const fml = parts[1] ? parts[1].replace(/^公式:\s*/, '').trim() : '';
            text += `  ${i+1}. ${it.part}\n     说明：${desc}\n     公式：${fml}\n`;
            if (it.res) text += `     结果：${it.res} m³\n`;
            text += `\n`;
          });
          text += `  ☆ 小计：土方工程量 ${globalCalcData.earthwork.total} m³\n\n`;
        }
        
        return text;
      }
      
      if(type === 'costSummary') {
        const cd = globalCalcData.costDetail;
        text += `═══════════════════════════════\n二、成本统计\n═══════════════════════════════\n\n`;
        
        if (cd.laborItems.length > 0) {
          text += `【人工费】合计 ${cd.laborTotal.toFixed(2)} 元\n\n`;
          cd.laborItems.forEach((it, i) => {
            text += `  ${i+1}. ${it.part}\n     数量：${it.qtyStr}\n     人工单价：${it.priceStr}\n     公式：${it.formulaStr} = ${it.amount.toFixed(2)} 元\n\n`;
          });
        }
        if (cd.materialItems.length > 0) {
          text += `【材料费】合计 ${cd.materialTotal.toFixed(2)} 元\n\n`;
          cd.materialItems.forEach((it, i) => {
            text += `  ${i+1}. ${it.part}\n     数量：${it.qtyStr}\n     材料单价：${it.priceStr}\n     公式：${it.formulaStr} = ${it.amount.toFixed(2)} 元\n\n`;
          });
        }
        if (cd.machineItems.length > 0) {
          text += `【机械费】合计 ${cd.machineTotal.toFixed(2)} 元\n\n`;
          cd.machineItems.forEach((it, i) => {
            text += `  ${i+1}. ${it.part}\n     数量：${it.qtyStr}\n     单价：${it.priceStr}\n     公式：${it.formulaStr} = ${it.amount.toFixed(2)} 元\n\n`;
          });
        }
        
        text += `【措施费】合计 ${cd.measureCost.toFixed(2)} 元\n`;
        text += `     公式：直接费 ${cd.directFee.toFixed(2)} × 措施费率 ${(cd.measureRate*100)}% = ${cd.measureCost.toFixed(2)} 元\n\n`;
        text += `【直接成本】合计 ${cd.direct.toFixed(2)} 元 （人材机+措施费）\n\n`;
        text += `【管理费】合计 ${cd.mgmtCost.toFixed(2)} 元\n`;
        text += `     公式：直接成本 ${cd.direct.toFixed(2)} × 管理费率 ${(cd.mgmtRate*100)}% = ${cd.mgmtCost.toFixed(2)} 元\n\n`;
        text += `【其余费用】合计 ${cd.otherCost.toFixed(2)} 元 （措施费+管理费）\n\n`;
        
        const profitBase = cd.direct + cd.mgmtCost;
        text += `【利润】合计 ${cd.profit.toFixed(2)} 元\n`;
        text += `     公式：(直接成本 ${cd.direct.toFixed(2)} + 管理费 ${cd.mgmtCost.toFixed(2)}) × 利润率 ${(cd.profitRate*100)}% = ${cd.profit.toFixed(2)} 元\n\n`;
        
        const taxBase = profitBase + cd.profit;
        text += `【税金】合计 ${cd.tax.toFixed(2)} 元\n`;
        text += `     公式：(直接成本 ${cd.direct.toFixed(2)} + 管理费 ${cd.mgmtCost.toFixed(2)} + 利润 ${cd.profit.toFixed(2)}) × 增值税率 ${(cd.taxRate*100)}% = ${cd.tax.toFixed(2)} 元\n\n`;
        
        text += `═══════════════════════════════\n【综合汇总】\n═══════════════════════════════\n`;
        text += `  直接成本：${cd.direct.toFixed(2)} 元\n`;
        text += `  管理费：${cd.mgmtCost.toFixed(2)} 元\n`;
        text += `  利润：${cd.profit.toFixed(2)} 元\n`;
        text += `  税金：${cd.tax.toFixed(2)} 元\n`;
        text += `  ───────────────────────────\n`;
        text += `  ★ 含税总价：${cd.finalPrice.toFixed(2)} 元\n`;
        return text;
      }
      
      if(type === 'priceSummary') {
        const cd = globalCalcData.costDetail;
        text += `═══════════════════════════════\n三、总价汇总\n═══════════════════════════════\n\n`;
        text += `【直接成本】 ${cd.direct.toFixed(2)} 元\n`;
        text += `     公式：人材机 ${cd.directFee.toFixed(2)} + 措施费 ${cd.measureCost.toFixed(2)} = ${cd.direct.toFixed(2)} 元\n\n`;
        text += `【管理费】 ${cd.mgmtCost.toFixed(2)} 元\n`;
        text += `     基数：直接成本\n`;
        text += `     说明：管理费 = 直接成本 × 管理费率\n`;
        text += `     公式：${cd.direct.toFixed(2)} × ${(cd.mgmtRate*100)}% = ${cd.mgmtCost.toFixed(2)} 元\n\n`;
        text += `【利润】 ${cd.profit.toFixed(2)} 元\n`;
        text += `     基数：直接成本 + 管理费\n`;
        text += `     说明：利润 = (直接成本 + 管理费) × 利润率\n`;
        text += `     公式：(${cd.direct.toFixed(2)} + ${cd.mgmtCost.toFixed(2)}) × ${(cd.profitRate*100)}% = ${cd.profit.toFixed(2)} 元\n\n`;
        text += `【税金】 ${cd.tax.toFixed(2)} 元\n`;
        text += `     基数：直接成本 + 管理费 + 利润\n`;
        text += `     说明：税金 = (直接成本 + 管理费 + 利润) × 增值税率\n`;
        text += `     公式：(${cd.direct.toFixed(2)} + ${cd.mgmtCost.toFixed(2)} + ${cd.profit.toFixed(2)}) × ${(cd.taxRate*100)}% = ${cd.tax.toFixed(2)} 元\n\n`;
        text += `  ───────────────────────────\n`;
        text += `  ★ 含税总价：${cd.finalPrice.toFixed(2)} 元\n`;
        return text;
      }
      
      if(type === 'machQuantity') {
        const ei = globalCalcData.earthworkInfo || {};
        text += `【机械工程量明细】\n\n`;
        text += `  长臂挖机下沉深度\n`;
        text += `     说明：机械下沉深度 = 总深度 − 开挖深度\n`;
        text += `     公式：${(ei.totalDepth||0).toFixed(2)} − ${(ei.excavDepth||0).toFixed(2)} = ${(ei.machDepth||0).toFixed(2)} m\n\n`;
        text += `  长臂挖机工程量\n`;
        text += `     说明：圆柱体积 = π × (外径/2)² × 机械下沉深度\n`;
        text += `     公式：π × (${((ei.extD||0)/2).toFixed(2)})² × ${(ei.machDepth||0).toFixed(2)} = ${(ei.Vmach||0).toFixed(2)} m³\n\n`;
        text += `★ 机械工程量合计：${(ei.Vmach||0).toFixed(2)} m³\n`;
        return text;
      }
      
      if(type === 'laborCost') {
        const cd = globalCalcData.costDetail;
        text += `【人工费明细】\n\n`;
        cd.laborItems.forEach((it, i) => {
          text += `${i+1}. ${it.part}\n   数量：${it.qtyStr}\n   人工单价：${it.priceStr}\n   公式：${it.formulaStr} = ${it.amount.toFixed(2)} 元\n\n`;
        });
        text += `★ 人工费合计：${cd.laborTotal.toFixed(2)} 元\n`;
        return text;
      }
      
      if(type === 'materialCost') {
        const cd = globalCalcData.costDetail;
        text += `【材料费明细】\n\n`;
        cd.materialItems.forEach((it, i) => {
          text += `${i+1}. ${it.part}\n   数量：${it.qtyStr}\n   材料单价：${it.priceStr}\n   公式：${it.formulaStr} = ${it.amount.toFixed(2)} 元\n\n`;
        });
        text += `★ 材料费合计：${cd.materialTotal.toFixed(2)} 元\n`;
        return text;
      }
      
      if(type === 'machineCost') {
        const cd = globalCalcData.costDetail;
        text += `【机械费明细】\n\n`;
        cd.machineItems.forEach((it, i) => {
          text += `${i+1}. ${it.part}\n   数量：${it.qtyStr}\n   单价：${it.priceStr}\n   公式：${it.formulaStr} = ${it.amount.toFixed(2)} 元\n\n`;
        });
        text += `★ 机械费合计：${cd.machineTotal.toFixed(2)} 元\n`;
        return text;
      }
      
      if(type === 'otherCost') {
        const cd = globalCalcData.costDetail;
        text += `【其余费用明细】\n\n`;
        text += `【措施费】${cd.measureCost.toFixed(2)} 元\n`;
        text += `     公式：直接费 ${cd.directFee.toFixed(2)} × 措施费率 ${(cd.measureRate*100)}% = ${cd.measureCost.toFixed(2)} 元\n\n`;
        text += `【管理费】${cd.mgmtCost.toFixed(2)} 元\n`;
        text += `     公式：直接成本 ${cd.direct.toFixed(2)} × 管理费率 ${(cd.mgmtRate*100)}% = ${cd.mgmtCost.toFixed(2)} 元\n\n`;
        text += `★ 其余费用合计：${cd.otherCost.toFixed(2)} 元\n`;
        return text;
      }
      
      text += `【${document.getElementById('detailModalTitle').innerText}】\n\n`;
      const data = globalCalcData[type];
      
      if(type !== 'rebar') {
        const filtered = data.filter(item => {
          if (!item.res) return data.total > 0;
          const n = parseFloat(item.res);
          return isNaN(n) || n > 0;
        });
        
        if (filtered.length === 0) {
          text += `（无有效数据）\n`;
        } else {
          filtered.forEach(item => { 
            const lines = item.formula.replace(/<br>/g, '\n').split('\n');
            text += `[${item.part}]\n${lines.join('\n')}\n\n`;
          });
          text += `★ 合计用量: ${data.total}\n`;
        }
      } else {
        data.forEach(item => { 
          text += `[${item.part}]\n${item.formula.replace(/<br>/g, '\n')}\n\n`; 
        });
        text += `\n【型号汇总(t)】\n`;
        for(let d in globalCalcData.rebarSum) {
          if (globalCalcData.rebarSum[d] > 0) {
            text += `Φ${d}: ${(globalCalcData.rebarSum[d]/1000).toFixed(3)} t\n`;
          }
        }
        text += `★ 钢筋总计: ${(data.total/1000).toFixed(3)} t\n`;
      }
      return text;
    }

    document.getElementById('openSettingsBtn').onclick = () => { 
      document.body.classList.add('modal-open'); 
      fillSettingsInputs();
      document.getElementById('settingsOverlay').classList.add('active'); 
      renderHistory(); 
    };
    
    document.getElementById('unlockBtn').onclick = () => {
      if(document.getElementById('pwdInput').value === '000000') {
        unlocked = true; 
        document.getElementById('lockPanel').classList.add('hidden'); 
        document.getElementById('historySection').classList.add('hidden'); 
        document.getElementById('settingsContent').classList.remove('hidden'); 
        fillSettingsInputs();
        ['barLength','lossRate','kLen','lapFactor','protect','concreteFactor','brickL','brickW','brickH','mortarJoint'].forEach(id => document.getElementById(id).disabled = false);
      } else { alert('密码错误，请重试'); }
    };
    
    document.getElementById('applySettingsBtn').onclick = () => {
      if(unlocked) {
        config.barLength = parseFloat(document.getElementById('barLength').value); 
        config.lossRate = parseFloat(document.getElementById('lossRate').value);
        config.kLen = parseFloat(document.getElementById('kLen').value); 
        config.lapFactor = parseFloat(document.getElementById('lapFactor').value);
        config.protect = parseFloat(document.getElementById('protect').value);
        config.concreteFactor = parseFloat(document.getElementById('concreteFactor').value);
        config.mortarJoint = parseFloat(document.getElementById('mortarJoint').value);
        config.brick = [parseFloat(document.getElementById('brickL').value), parseFloat(document.getElementById('brickW').value), parseFloat(document.getElementById('brickH').value)];
        if(isNaN(config.barLength)) config.barLength = DEFAULT_CONFIG.barLength;
        if(isNaN(config.lossRate)) config.lossRate = DEFAULT_CONFIG.lossRate;
        if(isNaN(config.kLen)) config.kLen = DEFAULT_CONFIG.kLen;
        if(isNaN(config.lapFactor)) config.lapFactor = DEFAULT_CONFIG.lapFactor;
        if(isNaN(config.protect)) config.protect = DEFAULT_CONFIG.protect;
        if(isNaN(config.concreteFactor)) config.concreteFactor = DEFAULT_CONFIG.concreteFactor;
        if(isNaN(config.mortarJoint)) config.mortarJoint = DEFAULT_CONFIG.mortarJoint;
        if(isNaN(config.brick[0])) config.brick[0] = DEFAULT_CONFIG.brick[0];
        if(isNaN(config.brick[1])) config.brick[1] = DEFAULT_CONFIG.brick[1];
        if(isNaN(config.brick[2])) config.brick[2] = DEFAULT_CONFIG.brick[2];
        saveConfig();
        fillSettingsInputs();
        unlocked = false;
        document.getElementById('pwdInput').value = '';
        document.getElementById('lockPanel').classList.remove('hidden');
        document.getElementById('historySection').classList.remove('hidden');
        document.getElementById('settingsContent').classList.add('hidden');
        closeModal('settingsOverlay'); 
        compute(false);
      }
    };

    function restoreLast(){
      const last = localStorage.getItem(LAST_INPUT_KEY);
      if(last){ 
        try{ 
          const {inputs} = JSON.parse(last); 
          if (inputs && inputs.mode) {
            currentMode = inputs.mode;
            if (currentMode === 'total' && inputs.priceMatRebar) {
              savedMatRebar = inputs.priceMatRebar;
              savedMatConc = inputs.priceMatConc || savedMatConc;
            }
          }
          restoreInputs(inputs); 
        }catch(e){} 
      }
      applyModeUI();
      compute(false);
    }

    document.getElementById('calculateBtn').addEventListener('click', function() {
      const btn = this;
      playTapSound();
      if (navigator.vibrate) { navigator.vibrate(20); }
      btn.classList.add('clicked-highlight');
      setTimeout(() => btn.classList.remove('clicked-highlight'), 150);
      compute(true);
    });

    loadConfig();
    syncH2(); restoreLast();
  })();
</script>
