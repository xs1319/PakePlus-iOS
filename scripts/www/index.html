    // 启动单侧骰子滚动（dirX, dirY 为手势方向单位向量，若无滑动则为随机方向）
    function rollSideDice(side, dirX = null, dirY = null) {
        if (gameMode !== 'pvp' || pvpPhase !== 'dice') return;
        const d = pvpDice[side];
        if (!d || d.status !== 'idle') return;

        const otherSide = side === 'top' ? 'bottom' : 'top';
        const myUserId = side === 'top' ? pvpTopUserId : pvpBottomUserId;
        const otherUserId = side === 'top' ? pvpBottomUserId : pvpTopUserId;
        const otherRolled = pvpDice[otherSide] && pvpDice[otherSide].status !== 'idle';

        if (otherRolled && myUserId === otherUserId) {
            SFX.wrong();
            showToast('该用户对方已选择', side);
            return;
        }

        d.status = 'rolling';
        d.rollDuration = 1650;
        SFX.pop();

        const rolledVal = Math.floor(Math.random() * 6) + 1;
        d.faceValue = rolledVal;

        let angle;
        let speed;
        if (dirX !== null && dirY !== null && (Math.abs(dirX) > 0.01 || Math.abs(dirY) > 0.01)) {
            angle = Math.atan2(dirY, dirX);
            speed = 1.05;
        } else {
            angle = Math.random() * Math.PI * 2;
            speed = 0.78 + Math.random() * 0.25;
        }

        d.vx = Math.cos(angle) * speed;
        d.vy = Math.sin(angle) * speed;
        d.z = 0;

        d.startRotX = d.rotX;
        d.startRotY = d.rotY;
        d.startRotZ = d.rotZ;

        const targetEuler = getTargetEulerForFace(rolledVal);
        const signX = d.vy >= 0 ? 1 : -1;
        const signY = d.vx >= 0 ? -1 : 1;
        const spinsX = signX * (3 + Math.floor(Math.random() * 2)) * Math.PI * 2;
        const spinsY = signY * (3 + Math.floor(Math.random() * 2)) * Math.PI * 2;
        const spinsZ = (Math.random() < 0.5 ? 1 : -1) * Math.PI * 2;

        d.targetRotX = targetEuler.rx + spinsX;
        d.targetRotY = targetEuler.ry + spinsY;
        d.targetRotZ = targetEuler.rz + spinsZ;

        d.rollStartTime = performance.now();
        d.lastTickTime = d.rollStartTime;
        d.lastSoundBounce = 0;

        updateUI();
        if (!diceLoopId) {
            diceLoopId = requestAnimationFrame(stepBothDiceAnimation);
        }
    }

    function stepBothDiceAnimation(now) {
        diceLoopId = null;
        if (pvpPhase !== 'dice') return;

        let anyRolling = false;

        ['top', 'bottom'].forEach(side => {
            const d = pvpDice[side];
            if (d.status !== 'rolling') return;
            anyRolling = true;

            const elapsed = now - d.rollStartTime;
            const dt = Math.min(0.05, (now - d.lastTickTime) / 1000);
            d.lastTickTime = now;

            const progress = Math.min(1, elapsed / d.rollDuration);
            // 落地前明显减速的缓出曲线
            const easeOut = 1 - Math.pow(1 - progress, 4);
            // 速度因子：临近落地迅速减速
            const slowFactor = Math.pow(1 - progress, 2.8);

            const minX = 0.16, maxX = 0.84;
            const minY = side === 'top' ? 0.15 : 0.62;
            const maxY = side === 'top' ? 0.38 : 0.85;

            if (progress < 0.94) {
                d.x += d.vx * slowFactor * dt * 1.4;
                d.y += d.vy * slowFactor * dt * 1.4;

                if (d.x < minX) {
                    d.x = minX;
                    d.vx = Math.abs(d.vx) * 0.65;
                    SFX.click();
                } else if (d.x > maxX) {
                    d.x = maxX;
                    d.vx = -Math.abs(d.vx) * 0.65;
                    SFX.click();
                }
                if (d.y < minY) {
                    d.y = minY;
                    d.vy = Math.abs(d.vy) * 0.65;
                    SFX.click();
                } else if (d.y > maxY) {
                    d.y = maxY;
                    d.vy = -Math.abs(d.vy) * 0.65;
                    SFX.click();
                }
            }

            // 垂直微抬高度衰减归零（不放大骰子，保持尺寸恒定）
            if (progress < 0.85) {
                const bouncePhase = progress / 0.85;
                const amp = Math.pow(1 - bouncePhase, 2.2) * 0.35;
                d.z = Math.abs(Math.sin(bouncePhase * Math.PI * 2.5)) * amp;
                const bounceIdx = Math.floor(bouncePhase * 2.5);
                if (bounceIdx > d.lastSoundBounce && bounceIdx <= 1) {
                    d.lastSoundBounce = bounceIdx;
                    SFX.click();
                }
            } else {
                d.z = 0;
            }

            d.rotX = d.startRotX + (d.targetRotX - d.startRotX) * easeOut;
            d.rotY = d.startRotY + (d.targetRotY - d.startRotY) * easeOut;
            d.rotZ = d.startRotZ + (d.targetRotZ - d.startRotZ) * easeOut;

            if (progress >= 1) {
                d.rotX = d.targetRotX;
                d.rotY = d.targetRotY;
                d.rotZ = d.targetRotZ;
                d.z = 0;
                d.status = 'done';
                SFX.correct();
            }
        });

        updateUI();
        draw();

        if (anyRolling) {
            diceLoopId = requestAnimationFrame(stepBothDiceAnimation);
        } else if (pvpDice.top.status === 'done' && pvpDice.bottom.status === 'done') {
            evaluateBothDiceResult();
        }
    }

    function evaluateBothDiceResult() {
        const topVal = pvpDice.top.faceValue;
        const bottomVal = pvpDice.bottom.faceValue;
        const topUser = getUserById(pvpTopUserId);
        const bottomUser = getUserById(pvpBottomUserId);

        if (topVal === bottomVal) {
            SFX.wrong();
            pvpPhase = 'dice_result';
            diceWinnerSide = 'tie';
            draw();
            showToast(`双方均掷出 ${topVal} 点平局！请再掷一次`, 'mirror', { isUserTriggered: false });
            diceResultTimer = setTimeout(() => {
                if (gameMode !== 'pvp') return;
                resetBothDiceForRoll(`平局（同为 ${topVal} 点），请双方再掷一次！`);
            }, 1400);
            return;
        }

        pvpPhase = 'dice_result';
        diceWinnerSide = topVal > bottomVal ? 'top' : 'bottom';
        const winnerUser = diceWinnerSide === 'top' ? topUser : bottomUser;
        SFX.win();

        updateUI();
        draw();

        diceResultTimer = setTimeout(() => {
            if (gameMode !== 'pvp' || pvpPhase !== 'dice_result') return;
            if (diceWinnerSide === 'top') {
                pvpTopColor = 1;
                pvpBottomColor = 2;
            } else {
                pvpTopColor = 2;
                pvpBottomColor = 1;
            }
            pvpPhase = 'playing';
            currentPlayer = 1;
            gameStartTime = Date.now();
            const banner = document.getElementById('diceHintBanner');
            if (banner) banner.classList.remove('show');
            syncPlayerZonesLayout();
            updateUI();
            draw();
            startTurnTimer(true);
            showToast(`${winnerUser.name} 执黑先手，请落子！`, 'mirror', { isUserTriggered: false });
        }, 2000);
    }

    function draw() {
        if (!canvas || canvas.width === 0) return;

        const isDiceStage = (gameMode === 'pvp' && pvpPhase !== 'playing');
        canvas.classList.toggle('dice-stage-blur', isDiceStage);
        if (canvas.parentElement) {
            canvas.parentElement.classList.toggle('dice-stage-frame', isDiceStage);
        }
        if (isDiceStage) {
            drawSplitDiceStage();
            return;
        }

        drawBoard();

        const now = performance.now();

        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c] !== 0) {
                    const isLatest = lastMove && lastMove.r === r && lastMove.c === c;
                    let scale = 1;

                    if (isWinAnimating && winningCells.some(wc => wc.r === r && wc.c === c)) {
                        const t = (now - winAnimStartTime) / 1000;
                        const pulse = Math.sin(t * Math.PI / 0.4);
                        scale = 1 + pulse * 0.05;
                    }

                    drawPiece(c, r, board[r][c], isLatest, scale);
                }
            }
        }

        const canHumanPreview = !gameOver && !isPaused && (gameMode === 'pvp' || currentPlayer === playerColor);
        if (canHumanPreview && previewPos && board[previewPos.r][previewPos.c] === 0) {
            ctx.globalAlpha = 0.5;
            drawPiece(previewPos.c, previewPos.r, currentPlayer, false);
            ctx.globalAlpha = 1.0;
        }
    }

    function drawSmoothJadeDice(d, diceSize) {
        const half = diceSize * 0.5;
        const innerW = CANVAS_SIZE - PADDING * 2;
        const cx = PADDING + d.x * innerW;
        const cy = PADDING + d.y * innerW - d.z * CELL_SIZE * 0.9;
        const scale = 1 + d.z * 0.12;
        const h = half * scale;

        ctx.save();

        // 过滤极短边拐角，防止旋转到特定角度时相邻投影点间距过小导致局部圆角塌陷成尖角
        const rawCorners3D = [];
        for (const sx of [-1, 1]) {
            for (const sy of [-1, 1]) {
                for (const sz of [-1, 1]) {
                    const rv = rotateVec3([sx * h * 0.96, sy * h * 0.96, sz * h * 0.96], d.rotX, d.rotY, d.rotZ);
                    const px = cx + rv[0];
                    const py = cy - rv[1];
                    if (!rawCorners3D.some(p => Math.hypot(p.x - px, p.y - py) < 2.0)) {
                        rawCorners3D.push({ x: px, y: py });
                    }
                }
            }
        }
        // Andrew 单调链求二维凸包
        rawCorners3D.sort((a, b) => a.x === b.x ? a.y - b.y : a.x - b.x);
        const cross2D = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
        const lowerHull = [];
        for (const p of rawCorners3D) {
            while (lowerHull.length >= 2 && cross2D(lowerHull[lowerHull.length - 2], lowerHull[lowerHull.length - 1], p) <= 1e-2) lowerHull.pop();
            lowerHull.push(p);
        }
        const upperHull = [];
        for (let i = rawCorners3D.length - 1; i >= 0; i--) {
            const p = rawCorners3D[i];
            while (upperHull.length >= 2 && cross2D(upperHull[upperHull.length - 2], upperHull[upperHull.length - 1], p) <= 1e-2) upperHull.pop();
            upperHull.push(p);
        }
        lowerHull.pop();
        upperHull.pop();
        const rawHull = lowerHull.concat(upperHull);

        // 剔除凸包中彼此距离过近（< h * 0.35）的凸包顶点，保证每条凸包边都有充足空间生成平滑大圆角
        const minEdgeSpan = Math.max(4, h * 0.35);
        const hull = [];
        for (const pt of rawHull) {
            if (hull.length === 0 || Math.hypot(pt.x - hull[hull.length - 1].x, pt.y - hull[hull.length - 1].y) >= minEdgeSpan) {
                hull.push(pt);
            }
        }
        if (hull.length >= 3 && Math.hypot(hull[0].x - hull[hull.length - 1].x, hull[0].y - hull[hull.length - 1].y) < minEdgeSpan) {
            hull.pop();
        }

        const outerR = h * 1.32;
        const baseGrad = ctx.createRadialGradient(
            cx - outerR * 0.30, cy - outerR * 0.32, outerR * 0.06,
            cx, cy, outerR * 1.12
        );
        baseGrad.addColorStop(0, '#ffffff');
        baseGrad.addColorStop(0.58, '#efefef');
        baseGrad.addColorStop(0.88, '#d4d4d4');
        baseGrad.addColorStop(1, '#b8b8b8');

        if (hull.length >= 3) {
            ctx.beginPath();
            const hullCornerR = h * 0.44;
            for (let i = 0; i < hull.length; i++) {
                const curr = hull[i];
                const next = hull[(i + 1) % hull.length];
                const prev = hull[(i + hull.length - 1) % hull.length];
                const dx1 = prev.x - curr.x, dy1 = prev.y - curr.y;
                const dx2 = next.x - curr.x, dy2 = next.y - curr.y;
                const len1 = Math.hypot(dx1, dy1) || 1;
                const len2 = Math.hypot(dx2, dy2) || 1;
                // 当某条边较短时，两侧圆角按比例均分，防止圆角控制点越过中点形成尖锐夹角
                const maxRatio1 = Math.min(0.42, (len1 * 0.48) / Math.max(len1, 1e-5));
                const maxRatio2 = Math.min(0.42, (len2 * 0.48) / Math.max(len2, 1e-5));
                const r1 = Math.min(hullCornerR, len1 * maxRatio1);
                const r2 = Math.min(hullCornerR, len2 * maxRatio2);
                const p1x = curr.x + (dx1 / len1) * r1;
                const p1y = curr.y + (dy1 / len1) * r1;
                const p2x = curr.x + (dx2 / len2) * r2;
                const p2y = curr.y + (dy2 / len2) * r2;
                if (i === 0) ctx.moveTo(p1x, p1y);
                else ctx.lineTo(p1x, p1y);
                ctx.quadraticCurveTo(curr.x, curr.y, p2x, p2y);
            }
            ctx.closePath();
            ctx.fillStyle = baseGrad;
            ctx.fill();
        }

        // 筛选朝向观察者 (+Z) 的可见面并按深度排序（加入平滑透明度过渡，消除临界角跳变撕裂）
        const visibleFaces = [];
        for (const face of DICE_FACES) {
            const rn = rotateVec3(face.n, d.rotX, d.rotY, d.rotZ);
            if (rn[2] > 0.02) {
                const ru = rotateVec3(face.u, d.rotX, d.rotY, d.rotZ);
                const rv = rotateVec3(face.v, d.rotX, d.rotY, d.rotZ);
                visibleFaces.push({ face, rn, ru, rv });
            }
        }
        visibleFaces.sort((a, b) => a.rn[2] - b.rn[2]);

        for (const item of visibleFaces) {
            const { face, rn, ru, rv } = item;
            const fcx = cx + rn[0] * h * 0.90;
            const fcy = cy - rn[1] * h * 0.90;
            const faceScale = 0.92;

            const corners = [
                [-1, -1], [1, -1], [1, 1], [-1, 1]
            ].map(([su, sv]) => ({
                x: fcx + (su * ru[0] + sv * rv[0]) * h * faceScale,
                y: fcy - (su * ru[1] + sv * rv[1]) * h * faceScale
            }));

            // 大圆角多边形面，并在极小倾斜角时平滑淡入淡出，杜绝最后几帧侧面闪切撕裂
            ctx.save();
            ctx.globalAlpha = Math.min(1, Math.max(0, (rn[2] - 0.02) / 0.14));
            ctx.beginPath();
            const cornerRadius = h * 0.42;
            for (let i = 0; i < 4; i++) {
                const curr = corners[i];
                const next = corners[(i + 1) % 4];
                const prev = corners[(i + 3) % 4];
                const dx1 = prev.x - curr.x, dy1 = prev.y - curr.y;
                const dx2 = next.x - curr.x, dy2 = next.y - curr.y;
                const len1 = Math.hypot(dx1, dy1) || 1;
                const len2 = Math.hypot(dx2, dy2) || 1;
                const r1 = Math.min(cornerRadius, len1 * 0.36);
                const r2 = Math.min(cornerRadius, len2 * 0.36);
                const p1x = curr.x + (dx1 / len1) * r1;
                const p1y = curr.y + (dy1 / len1) * r1;
                const p2x = curr.x + (dx2 / len2) * r2;
                const p2y = curr.y + (dy2 / len2) * r2;
                if (i === 0) ctx.moveTo(p1x, p1y);
                else ctx.lineTo(p1x, p1y);
                ctx.quadraticCurveTo(curr.x, curr.y, p2x, p2y);
            }
            ctx.closePath();

            // 白子同款温润光泽径向渐变（无生硬黑边）
            const grad = ctx.createRadialGradient(
                fcx - h * 0.28, fcy - h * 0.30, h * 0.05,
                fcx, fcy, h * 1.25
            );
            if (rn[2] > 0.78) {
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.58, '#ebebeb');
                grad.addColorStop(1, '#bdbdbd');
            } else {
                grad.addColorStop(0, '#f0f0f0');
                grad.addColorStop(0.6, '#d6d6d6');
                grad.addColorStop(1, '#a6a6a6');
            }
            ctx.fillStyle = grad;
            ctx.fill();

            // 与白子完全一致的顶部柔光椭圆纹理
            if (rn[2] > 0.65) {
                ctx.beginPath();
                ctx.ellipse(fcx - h * 0.20, fcy - h * 0.30, h * 0.32, h * 0.15, Math.PI / 4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.fill();
            }

            // 绘制立体凹陷感红色点数（直径放大10%，且透视压扁严格沿法线屏幕方向，确保4/5/6点矩形排列与骰子边完全平行）
            const pipBaseR = (face.val === 1 ? h * 0.275 : h * 0.160) * faceScale;
            const nProjLen = Math.hypot(rn[0], -rn[1]);
            const tiltAngle = nProjLen > 1e-4 ? Math.atan2(-rn[1], rn[0]) : 0;
            for (const [pu, pv] of face.pips) {
                const px = fcx + (pu * ru[0] + pv * rv[0]) * h * faceScale;
                const py = fcy - (pu * ru[1] + pv * rv[1]) * h * faceScale;

                ctx.save();
                ctx.translate(px, py);
                if (nProjLen > 1e-4) {
                    ctx.rotate(tiltAngle);
                    ctx.scale(Math.max(0.34, rn[2]), 1);
                }

                const pipGrad = ctx.createRadialGradient(-pipBaseR * 0.22, -pipBaseR * 0.22, pipBaseR * 0.08, 0, 0, pipBaseR);
                pipGrad.addColorStop(0, '#ff4d4f');
                pipGrad.addColorStop(0.58, '#dc2626');
                pipGrad.addColorStop(1, '#991b1b');

                ctx.beginPath();
                ctx.arc(0, 0, pipBaseR, 0, Math.PI * 2);
                ctx.fillStyle = pipGrad;
                ctx.fill();
                ctx.restore();
            }

            ctx.restore();
        }

        ctx.restore();
    }

    function drawSplitDiceStage() {
        ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
        const styles = getComputedStyle(document.body);
        const borderColor = styles.getPropertyValue('--board-border').trim() || 'rgba(80,80,80,0.3)';
        const textColor = styles.getPropertyValue('--text-color').trim() || '#333333';

        // 清透熏黑玻璃质感：低遮挡透出底下的水墨山水，边缘保留细腻玻璃微光
        ctx.save();
        const rx0 = PADDING / 2, ry0 = PADDING / 2;
        const rw = CANVAS_SIZE - PADDING, rh = CANVAS_SIZE - PADDING;
        ctx.beginPath();
        ctx.roundRect(rx0, ry0, rw, rh, 6);
        ctx.clip();

        // 极轻薄的斜向玻璃反光，不遮挡底下背景细节
        const sheenGrad = ctx.createLinearGradient(rx0, ry0, rx0 + rw * 0.9, ry0 + rh * 0.9);
        sheenGrad.addColorStop(0, 'rgba(255, 255, 255, 0.12)');
        sheenGrad.addColorStop(0.35, 'rgba(255, 255, 255, 0.02)');
        sheenGrad.addColorStop(0.7, 'rgba(10, 15, 25, 0.06)');
        sheenGrad.addColorStop(1, 'rgba(255, 255, 255, 0.08)');
        ctx.fillStyle = sheenGrad;
        ctx.fillRect(rx0, ry0, rw, rh);
        ctx.restore();

        // 细腻玻璃外边框
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.26)';
        ctx.lineWidth = Math.max(1, CELL_SIZE * 0.06);
        ctx.strokeRect(PADDING / 2, PADDING / 2, CANVAS_SIZE - PADDING, CANVAS_SIZE - PADDING);

        // 中央水平分隔线
        const midY = CANVAS_SIZE / 2;
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
        ctx.lineWidth = Math.max(1, CELL_SIZE * 0.06);
        ctx.beginPath();
        ctx.moveTo(PADDING / 2, midY);
        ctx.lineTo(CANVAS_SIZE - PADDING / 2, midY);
        ctx.stroke();
        ctx.restore();

        const topUser = getUserById(pvpTopUserId);
        const bottomUser = getUserById(pvpBottomUserId);
        // 上半区投掷区域中心（PADDING ~ midY）与下半区投掷区域中心（midY ~ CANVAS_SIZE - PADDING）
        const topZoneCenterY = (PADDING + midY) / 2;
        const bottomZoneCenterY = (midY + (CANVAS_SIZE - PADDING)) / 2;

        // 仅在投掷阶段（dice）显示区域引导文字；进入 dice_result 时由投掷区正中央的结果窗口替代，避免文字重叠遮挡
        if (pvpPhase === 'dice') {
            // 上半区提示文字（旋转180度面向对面用户）
            ctx.save();
            ctx.translate(CANVAS_SIZE / 2, midY - 22);
            ctx.rotate(Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
            ctx.shadowBlur = 4;
            ctx.font = 'bold 13px "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const topHint = pvpDice.top.status === 'idle'
                ? `${topUser.name}：点击或滑动骰子`
                : (pvpDice.top.status === 'rolling' ? '掷骰中...' : `${topUser.name} 掷出 ${pvpDice.top.faceValue} 点`);
            ctx.fillText(topHint, 0, 0);
            ctx.restore();

            // 下半区提示文字（正向面向下方用户）
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
            ctx.shadowBlur = 4;
            ctx.font = 'bold 13px "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const bottomHint = pvpDice.bottom.status === 'idle'
                ? `${bottomUser.name}：点击或滑动骰子`
                : (pvpDice.bottom.status === 'rolling' ? '掷骰中...' : `${bottomUser.name} 掷出 ${pvpDice.bottom.faceValue} 点`);
            ctx.fillText(bottomHint, CANVAS_SIZE / 2, midY + 22);
            ctx.restore();
        }

        const diceSize = CELL_SIZE * 2.0;
        drawSmoothJadeDice(pvpDice.top, diceSize);
        drawSmoothJadeDice(pvpDice.bottom, diceSize);

        // 双方都掷完后的胜者与点数结果浮层：分别位于上下各自投掷区域正中央（上方旋转180°面向对面用户）
        if (pvpPhase === 'dice_result') {
            const boxW = Math.min(CANVAS_SIZE - 32, 268);
            const boxH = 56;

            function drawUserZoneResultCard(centerY, flip180) {
                ctx.save();
                ctx.translate(CANVAS_SIZE / 2, centerY);
                if (flip180) ctx.rotate(Math.PI);

                ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
                ctx.beginPath();
                ctx.roundRect(-boxW / 2, -boxH / 2, boxW, boxH, 14);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                if (diceWinnerSide === 'tie') {
                    ctx.fillStyle = '#fbbf24';
                    ctx.font = 'bold 14px "PingFang SC", "Microsoft YaHei", sans-serif';
                    ctx.fillText(`平局！双方均掷出 ${pvpDice.top.faceValue} 点`, 0, -9);
                    ctx.fillStyle = '#e2e8f0';
                    ctx.font = '12px "PingFang SC", "Microsoft YaHei", sans-serif';
                    ctx.fillText('即将重新掷骰决定先后手...', 0, 12);
                } else {
                    const winnerUser = diceWinnerSide === 'top' ? topUser : bottomUser;
                    ctx.fillStyle = '#fbbf24';
                    ctx.font = 'bold 13px "PingFang SC", "Microsoft YaHei", sans-serif';
                    ctx.fillText(`${topUser.name} ${pvpDice.top.faceValue}点  VS  ${bottomUser.name} ${pvpDice.bottom.faceValue}点`, 0, -10);
                    ctx.fillStyle = '#34d399';
                    ctx.font = 'bold 14px "PingFang SC", "Microsoft YaHei", sans-serif';
                    ctx.fillText(`胜者：${winnerUser.name}（执黑先手）`, 0, 11);
                }
                ctx.restore();
            }

            // 上方投掷区正中央（旋转180°） + 下方投掷区正中央（正向）
            drawUserZoneResultCard(topZoneCenterY, true);
            drawUserZoneResultCard(bottomZoneCenterY, false);
        }
    }

    function drawBoard() {
        ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

        const styles = getComputedStyle(document.body);
        const borderColor = styles.getPropertyValue('--board-border').trim() || 'rgba(80,80,80,0.3)';
        const lineColor = styles.getPropertyValue('--board-line').trim() || 'rgba(74, 74, 74, 0.8)';
        const starColor = styles.getPropertyValue('--star-color').trim() || '#333';

        ctx.strokeStyle = borderColor;
        ctx.lineWidth = Math.max(1, CELL_SIZE * 0.1);
        ctx.strokeRect(PADDING / 2, PADDING / 2, CANVAS_SIZE - PADDING, CANVAS_SIZE - PADDING);

        ctx.strokeStyle = lineColor;
        ctx.lineWidth = Math.max(1, CELL_SIZE * 0.03);
        for (let i = 0; i < BOARD_SIZE; i++) {
            ctx.beginPath(); ctx.moveTo(PADDING, PADDING + i * CELL_SIZE); ctx.lineTo(CANVAS_SIZE - PADDING, PADDING + i * CELL_SIZE); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(PADDING + i * CELL_SIZE, PADDING); ctx.lineTo(PADDING + i * CELL_SIZE, CANVAS_SIZE - PADDING); ctx.stroke();
        }

        const starPoints = [3, 7, 11];
        ctx.fillStyle = starColor;
        starPoints.forEach(x => {
            starPoints.forEach(y => {
                if ((x === 7 && y === 7) || (x === 3 && y === 3) || (x === 11 && y === 3) || (x === 3 && y === 11) || (x === 11 && y === 11)) {
                    ctx.beginPath();
                    ctx.arc(PADDING + x * CELL_SIZE, PADDING + y * CELL_SIZE, Math.max(1.5, CELL_SIZE * 0.1), 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        });
    }

    function drawPiece(col, row, player, isLatest, scale = 1) {
        const x = PADDING + col * CELL_SIZE;
        const y = PADDING + row * CELL_SIZE;
        const radius = CELL_SIZE * 0.4275 * scale;

        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.4)';
        ctx.shadowBlur = CELL_SIZE * 0.2;
        ctx.shadowOffsetX = CELL_SIZE * 0.05;
        ctx.shadowOffsetY = CELL_SIZE * 0.1;

        ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = player === 1 ? '#000' : '#fff'; ctx.fill();
        ctx.shadowColor = 'transparent';

        const gradient = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, radius * 0.05, x, y, radius * 1.1);
        if (player === 1) {
            gradient.addColorStop(0, 'rgba(150,150,150,0.8)');
            gradient.addColorStop(0.3, '#222');
            gradient.addColorStop(1, '#000');
        } else {
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(0.6, '#e6e6e6');
            gradient.addColorStop(1, '#a0a0a0');
        }
        ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fillStyle = gradient; ctx.fill();

        if (player === 1) {
            ctx.beginPath(); ctx.arc(x, y, radius - 1, 0.12 * Math.PI, 0.88 * Math.PI);
            ctx.strokeStyle = 'rgba(255,255,255,0.12)';
            ctx.lineWidth = Math.max(1, CELL_SIZE * 0.05); ctx.stroke();
        }

        ctx.beginPath();
        ctx.ellipse(x - radius * 0.22, y - radius * 0.34, radius * 0.36, radius * 0.17, Math.PI / 4, 0, Math.PI * 2);
        ctx.fillStyle = player === 1 ? 'rgba(255,255,255,0.28)' : 'rgba(255,255,255,0.92)'; ctx.fill();

        if (isLatest) {
            ctx.beginPath(); ctx.arc(x, y, radius * 0.25, 0, Math.PI * 2); ctx.fillStyle = '#ff3333'; ctx.fill();
            ctx.beginPath(); ctx.arc(x - radius * 0.08, y - radius * 0.08, radius * 0.08, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fill();
        }
        ctx.restore();
    }

    function getLocalCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return null;

        let localX, localY;
        if (isLandscapeForcedPortrait()) {
            localX = (e.clientY - rect.top) * (CANVAS_SIZE / rect.height);
            localY = (rect.right - e.clientX) * (CANVAS_SIZE / rect.width);
        } else {
            localX = (e.clientX - rect.left) * (CANVAS_SIZE / rect.width);
            localY = (e.clientY - rect.top) * (CANVAS_SIZE / rect.height);
        }
        return { x: localX, y: localY };
    }

    function getBoardCoordsFromEvent(e) {
        const pt = getLocalCanvasPos(e);
        if (!pt) return null;
        const c = Math.round((pt.x - PADDING) / CELL_SIZE);
        const r = Math.round((pt.y - PADDING) / CELL_SIZE);
        return { r, c };
    }

    function handleMouseMove(e) {
        if (e.pointerType === 'touch') return;
        if (isPaused) {
            previewPos = null;
            return;
        }
        if (gameMode === 'pvp' && pvpPhase !== 'playing') {
            previewPos = null;
            return;
        }
        if (gameOver || (gameMode === 'pve' && currentPlayer === aiColor)) {
            previewPos = null;
            return;
        }

        const pos = getBoardCoordsFromEvent(e);
        if (!pos) return;
        const { r, c } = pos;

        if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === 0) {
            if (!previewPos || previewPos.r !== r || previewPos.c !== c) {
                previewPos = { r, c };
                draw();
            }
        } else {
            previewPos = null;
        }
    }

    function handleCanvasPointerDown(e) {
        // 双人对战掷骰子阶段：记录按下的区域（上半区=top，下半区=bottom），支持点击或滑动触发骰子
        if (gameMode === 'pvp' && pvpPhase !== 'playing') {
            if (pvpPhase === 'dice') {
                const pt = getLocalCanvasPos(e);
                if (!pt) return;
                const side = pt.y < CANVAS_SIZE / 2 ? 'top' : 'bottom';
                if (pvpDice[side].status === 'idle') {
                    dicePointer.active = true;
                    dicePointer.pointerId = e.pointerId;
                    dicePointer.side = side;
                    dicePointer.startX = pt.x;
                    dicePointer.startY = pt.y;
                    dicePointer.startTime = performance.now();
                }
            }
            return;
        }

        if (isPaused) {
            showToast('对局已暂停，请先点击继续', 'bottom');
            return;
        }

        if (gameOver || (gameMode === 'pve' && currentPlayer === aiColor)) return;

        const pos = getBoardCoordsFromEvent(e);
        if (!pos) return;
        const { r, c } = pos;

        if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === 0) {
            makeMove(r, c, currentPlayer);
        }
    }

    function handleCanvasPointerUp(e) {
        if (!dicePointer.active) return;
        if (dicePointer.pointerId !== null && e.pointerId !== dicePointer.pointerId) return;

        const side = dicePointer.side;
        const startX = dicePointer.startX;
        const startY = dicePointer.startY;
        dicePointer.active = false;
        dicePointer.pointerId = null;
        dicePointer.side = null;

        if (gameMode !== 'pvp' || pvpPhase !== 'dice' || !side) return;
        if (pvpDice[side].status !== 'idle') return;

        const pt = getLocalCanvasPos(e);
        if (pt) {
            const dx = pt.x - startX;
            const dy = pt.y - startY;
            const dist = Math.hypot(dx, dy);
            // 若滑动距离超过 14px，则骰子严格按手势滑动方向滚动；否则视为点击，骰子随机方向滚动
            if (dist >= 14) {
                rollSideDice(side, dx / dist, dy / dist);
                return;
            }
        }
        rollSideDice(side, null, null);
    }

    function makeMove(r, c, moveColor = currentPlayer) {
        if (gameOver) return;
        if (moveColor !== currentPlayer) return;
        if (board[r][c] !== 0) return;

        clearInterval(turnTimer);

        SFX.pop();

        board[r][c] = moveColor;
        lastMove = { r, c };
        history.push({ r, c, player: moveColor });
        previewPos = null;

        const winCells = checkWin(r, c, moveColor);
        if (winCells) {
            gameOver = true;

            winningCells = winCells;
            winAnimStartTime = performance.now();
            isWinAnimating = true;

            updateUI();
            draw();

            if (gameMode === 'pvp') {
                savePvpBattleRecord(moveColor);
                SFX.win();
                confetti();
            } else {
                const isPlayerWin = (moveColor === playerColor);
                savePveBattleRecord(isPlayerWin ? 'win' : 'lose');
                if (isPlayerWin) {
                    SFX.win();
                    confetti();
                } else {
                    SFX.lose();
                }
            }

            requestAnimationFrame(animateWin);

            setTimeout(() => {
                showConfirm(moveColor === 1 ? '黑方胜利！' : '白方胜利！', () => {});
            }, 1000);

            return;
        }

        // 棋盘下满和棋判定
        if (history.length >= BOARD_SIZE * BOARD_SIZE) {
            gameOver = true;
            if (gameMode === 'pve') {
                savePveBattleRecord('draw');
            } else {
                savePvpBattleRecord(0);
            }
            updateUI();
            draw();
            setTimeout(() => {
                showConfirm('棋逢对手，平局！', () => {});
            }, 600);
            return;
        }

        currentPlayer = moveColor === 1 ? 2 : 1;
        updateUI();
        draw();

        startTurnTimer();

        if (gameMode === 'pve' && currentPlayer === aiColor && !gameOver) {
            setTimeout(() => makeAIMove(), 120);
        }
    }

    function animateWin(now) {
        if (!isWinAnimating) return;
        const elapsed = now - winAnimStartTime;

        if (elapsed > 5000) {
            isWinAnimating = false;
            winningCells = [];
            draw();
            return;
        }
        draw();
        requestAnimationFrame(animateWin);
    }

    /*
     * 悔棋规则：
     * - 区域1（上侧黑方区域）只能撤回黑子；区域2（下侧白方区域）只能撤回白子。
     * - 严格限制：刚落完子、对方尚未落子前才允许悔棋（一旦对方落子，己方不能再悔棋，只能落子）。
     * - 按钮样式统一显示为：悔棋（剩余次数 3/2/1/0）。
     */
    function undo(who) {
        if (isPaused) {
            showToast('对局已暂停，请先点击继续', 'bottom');
            return;
        }
        if (gameOver) {
            showToast('本局已结束，无法悔棋', 'bottom');
            return;
        }
        if (history.length === 0) {
            showToast('当前棋盘没有可悔棋的步骤', 'bottom');
            return;
        }
        if (gameMode === 'pve' && who !== playerColor) {
            SFX.wrong();
            showToast('只能操作自己的悔棋按钮');
            return;
        }
        if (undoCount[who] >= MAX_UNDO) {
            SFX.wrong();
            showToast('悔棋次数已用完（0次）');
            return;
        }

        if (gameMode === 'pvp') {
            // 双人模式下：必须满足“当前棋盘最后一手就是 who 下的（对方尚未落子）”，且当前处于对方等待落子阶段
            const last = history[history.length - 1];
            const opponent = who === 1 ? 2 : 1;
            if (currentPlayer !== opponent || last.player !== who) {
                SFX.wrong();
                showToast('对方已落子或尚未轮到，当前只能落子');
                return;
            }
            clearInterval(turnTimer);
            history.pop();
            board[last.r][last.c] = 0;
            undoCount[who]++;
            currentPlayer = who;
        } else {
            // 人机模式下：AI 落子极快，若人类刚下完且 AI 尚未落子则撤回 1 步；若 AI 已自动应手则撤回 AI + 人类共 2 步回到人类刚落子前
            if (currentPlayer === aiColor && history[history.length - 1].player === playerColor) {
                clearInterval(turnTimer);
                const playerStep = history.pop();
                if (playerStep) board[playerStep.r][playerStep.c] = 0;
                undoCount[who]++;
                currentPlayer = playerColor;
            } else if (currentPlayer === playerColor && history.length >= 2 && history[history.length - 1].player === aiColor) {
                clearInterval(turnTimer);
                const aiStep = history.pop();
                if (aiStep) board[aiStep.r][aiStep.c] = 0;
                const playerStep = history.pop();
                if (playerStep) board[playerStep.r][playerStep.c] = 0;
                undoCount[who]++;
                currentPlayer = playerColor;
            } else {
                SFX.wrong();
                showToast('当前无法悔棋');
                return;
            }
        }

        SFX.wrong();
        lastMove = history.length > 0 ? history[history.length - 1] : null;
        gameOver = false;
        previewPos = null;
        isWinAnimating = false;
        winningCells = [];

        updateUI();
        draw();
        showToast(`悔棋成功，剩余 ${MAX_UNDO - undoCount[who]} 次`);
        startTurnTimer();
    }

    function updateUI() {
        const p1Status = document.getElementById('p1Status');
        const p2Status = document.getElementById('p2Status');
        const p1StatusText = document.getElementById('p1StatusText');
        const p2StatusText = document.getElementById('p2StatusText');
        const hourglassWidget = document.getElementById('hourglassWidget');
        const btnTop = document.getElementById('btnUndoTop');
        const btnBottom = document.getElementById('btnUndoBottom');

        if (gameMode === 'pvp' && pvpPhase !== 'playing') {
            p1Status.classList.add('active');
            p2Status.classList.add('active');
            if (pvpPhase === 'dice') {
                const topRolled = pvpDice.top.status !== 'idle';
                const bottomRolled = pvpDice.bottom.status !== 'idle';
                if (topRolled && !bottomRolled) {
                    p1StatusText.innerText = '等待对方投掷';
                } else {
                    p1StatusText.innerText = pvpDice.top.status === 'idle' ? '待掷骰' : `${pvpDice.top.faceValue} 点`;
                }
                if (bottomRolled && !topRolled) {
                    p2StatusText.innerText = '等待对方投掷';
                } else {
                    p2StatusText.innerText = pvpDice.bottom.status === 'idle' ? '待掷骰' : `${pvpDice.bottom.faceValue} 点`;
                }
            } else {
                if (diceWinnerSide === 'tie') {
                    p1StatusText.innerText = `${pvpDice.top.faceValue}点（平局）`;
                    p2StatusText.innerText = `${pvpDice.bottom.faceValue}点（平局）`;
                } else {
                    p1StatusText.innerText = diceWinnerSide === 'top' ? `${pvpDice.top.faceValue}点 · 执黑` : `${pvpDice.top.faceValue}点 · 执白`;
                    p2StatusText.innerText = diceWinnerSide === 'bottom' ? `${pvpDice.bottom.faceValue}点 · 执黑` : `${pvpDice.bottom.faceValue}点 · 执白`;
                }
            }
            if (hourglassWidget) hourglassWidget.style.visibility = 'hidden';
            if (btnTop) {
                btnTop.innerText = `悔棋（${MAX_UNDO}）`;
                btnTop.classList.add('disabled');
            }
            if (btnBottom) {
                btnBottom.innerText = `悔棋（${MAX_UNDO}）`;
                btnBottom.classList.add('disabled');
            }
            return;
        }

        if (hourglassWidget) hourglassWidget.style.visibility = 'visible';

        const topSideColor = (gameMode === 'pvp') ? pvpTopColor : aiColor;
        const bottomSideColor = (gameMode === 'pvp') ? pvpBottomColor : playerColor;

        if (gameOver) {
            p1Status.classList.remove('active');
            p2Status.classList.remove('active');
            p1StatusText.innerText = '对局结束';
            p2StatusText.innerText = '对局结束';
        } else {
            p1Status.classList.toggle('active', currentPlayer === topSideColor);
            p2Status.classList.toggle('active', currentPlayer === bottomSideColor);
            p1StatusText.innerText = currentPlayer === topSideColor ? '思考中...' : '等待中';
            p2StatusText.innerText = currentPlayer === bottomSideColor ? '思考中...' : '等待中';
        }

        // 沙漏移位：轮到谁下子就移动到谁的区域
        const targetSlot = document.getElementById(currentPlayer === topSideColor ? 'topTimerSlot' : 'bottomTimerSlot');
        if (hourglassWidget && targetSlot && hourglassWidget.parentElement !== targetSlot) {
            targetSlot.appendChild(hourglassWidget);
        }

        // 更新悔棋按钮文案：悔棋（0/1/2/3）
        if (gameMode === 'pvp') {
            const topRemain = Math.max(0, MAX_UNDO - undoCount[pvpTopColor]);
            const bottomRemain = Math.max(0, MAX_UNDO - undoCount[pvpBottomColor]);
            if (btnTop) btnTop.innerText = `悔棋（${topRemain}）`;
            if (btnBottom) btnBottom.innerText = `悔棋（${bottomRemain}）`;

            let canTopUndo = false;
            let canBottomUndo = false;
            if (!gameOver && history.length > 0) {
                const lastPlayer = history[history.length - 1].player;
                canTopUndo = (topRemain > 0 && currentPlayer === pvpBottomColor && lastPlayer === pvpTopColor);
                canBottomUndo = (bottomRemain > 0 && currentPlayer === pvpTopColor && lastPlayer === pvpBottomColor);
            }
            if (btnTop) btnTop.classList.toggle('disabled', !canTopUndo);
            if (btnBottom) btnBottom.classList.toggle('disabled', !canBottomUndo);
        } else {
            const playerRemain = Math.max(0, MAX_UNDO - undoCount[playerColor]);
            if (btnBottom) {
                btnBottom.innerText = `悔棋（${playerRemain}）`;
                const canPlayerUndo = !gameOver && playerRemain > 0 && history.some(h => h.player === playerColor);
                btnBottom.classList.toggle('disabled', !canPlayerUndo);
            }
        }
    }

    function checkWin(r, c, player) {
        const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
        for (let [dr, dc] of dirs) {
            let count = 1;
            let cells = [{r, c}];

            for (let i = 1; i <= 4; i++) {
                const nr = r + dr * i, nc = c + dc * i;
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === player) {
                    count++;
                    cells.push({r: nr, c: nc});
                } else break;
            }
            for (let i = 1; i <= 4; i++) {
                const nr = r - dr * i, nc = c - dc * i;
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === player) {
                    count++;
                    cells.push({r: nr, c: nc});
                } else break;
            }

            if (count >= 5) {
                return cells;
            }
        }
        return null;
    }

    function renderDifficultyMenu() {
        const list = document.getElementById('difficultyList');
        list.innerHTML = '';
        DIFFICULTIES.forEach(diff => {
            const div = document.createElement('div');
            div.className = `menu-item`;
            div.innerText = diff.name;
            div.onclick = () => {
                SFX.click();
                aiConfig = diff;
                saveActiveProfileState();
                if (gameMode === 'pve') {
                    document.getElementById('p1Name').innerText = '系统';
                    document.getElementById('aiDiffCenter').innerText = aiConfig.name;
                }
                document.getElementById('difficultyModal').classList.remove('active');
                renderDifficultyMenu();
                initGame();
            };
            if(diff.id === aiConfig.id) {
                div.style.background = 'var(--modal-item-active)';
                div.style.color = '#d96556';
                div.style.fontWeight = 'bold';
                const check = document.createElement('span'); check.innerText = '✓';
                div.appendChild(check);
            }
            list.appendChild(div);
        });
    }

    function hasPvePlayerMoved() {
        return Array.isArray(history) && history.some(step => step.player === playerColor);
    }

    function isPveGameInProgress() {
        const gameUI = document.getElementById('gameUI');
        return gameMode === 'pve' && gameUI && gameUI.classList.contains('active') && !gameOver && hasPvePlayerMoved();
    }

    function openDifficulty() {
        if (isPveGameInProgress()) {
            SFX.wrong();
            showToast('游戏已开局，本局不可切换难度');
            return;
        }
        document.getElementById('difficultyModal').classList.add('active');
    }

    function makeAIMove() {
        if (gameOver || currentPlayer !== aiColor) return;

        let bestMove = null;

        if (history.length === 0) {
            bestMove = { r: 7, c: 7 };
        } else if (aiConfig.depth === 0) {
            bestMove = getEasyMove();
        } else {
            bestMove = getMinimaxMove(aiConfig.depth);
        }

        if (bestMove) makeMove(bestMove.r, bestMove.c, aiColor);
    }

    function getEasyMove() {
        let maxScore = -1;
        let candidates = [];

        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c] === 0 && hasNeighbor(r, c)) {
                    let myScore = evaluatePoint(r, c, aiColor);
                    let oppScore = evaluatePoint(r, c, playerColor);
                    let score = myScore * 1.0 + oppScore * 0.3;
                    score += Math.random() * aiConfig.random;

                    if (score > maxScore) {
                        maxScore = score;
                        candidates = [{ r, c }];
                    } else if (Math.abs(score - maxScore) < 100) {
                        candidates.push({ r, c });
                    }
                }
            }
        }
        return candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : getRandomEmpty();
    }

    function getMinimaxMove(depth) {
        let bestScore = -Infinity;
        let bestMoves = [];
        const candLimit = aiConfig.candLimit || 12;
        const candidates = getSortedCandidates(aiColor).slice(0, candLimit);

        // 必杀/必防急所优先：若己方可成五直接落子；若对手有活四/冲四必防点，优先纳入搜索
        for (let move of candidates) {
            board[move.r][move.c] = aiColor;
            const winNow = checkWin(move.r, move.c, aiColor);
            board[move.r][move.c] = 0;
            if (winNow) return move;
        }

        for (let move of candidates) {
            board[move.r][move.c] = aiColor;
            let score = minimax(depth - 1, false, -Infinity, Infinity, candLimit);
            board[move.r][move.c] = 0;

            if (aiConfig.random > 0) {
                score += (Math.random() * aiConfig.random);
            }

            if (score > bestScore) {
                bestScore = score;
                bestMoves = [move];
            } else if (aiConfig.random > 0 && Math.abs(score - bestScore) < aiConfig.random * 0.25) {
                bestMoves.push(move);
            }
        }
        return bestMoves.length ? bestMoves[Math.floor(Math.random() * bestMoves.length)] : getRandomEmpty();
    }

    function minimax(depth, isMaximizing, alpha, beta, candLimit = 12) {
        if (depth === 0) return evaluateBoard();

        let player = isMaximizing ? aiColor : playerColor;
        let bestScore = isMaximizing ? -Infinity : Infinity;

        let candidates = getSortedCandidates(player).slice(0, candLimit);

        if (candidates.length === 0) return evaluateBoard();

        for (let move of candidates) {
            board[move.r][move.c] = player;

            if (checkWin(move.r, move.c, player)) {
                board[move.r][move.c] = 0;
                return isMaximizing ? 1000000 + depth * 100 : -1000000 - depth * 100;
            }

            let score = minimax(depth - 1, !isMaximizing, alpha, beta, candLimit);
            board[move.r][move.c] = 0;

            if (isMaximizing) {
                bestScore = Math.max(bestScore, score);
                alpha = Math.max(alpha, bestScore);
            } else {
                bestScore = Math.min(bestScore, score);
                beta = Math.min(beta, bestScore);
            }
            if (beta <= alpha) break;
        }
        return bestScore;
    }

    function evaluateBoard() {
        let aiScore = 0;
        let playerScore = 0;
        const defWeight = aiConfig.defWeight || 1.2;

        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c] === aiColor) aiScore += evaluatePoint(r, c, aiColor);
                else if (board[r][c] === playerColor) playerScore += evaluatePoint(r, c, playerColor);
            }
        }
        return aiScore - playerScore * defWeight;
    }

    function getSortedCandidates(player) {
        let candidates = [];
        const opp = player === 1 ? 2 : 1;
        const defWeight = aiConfig.defWeight || 1.2;
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c] === 0 && hasNeighbor(r, c)) {
                    const atk = evaluatePoint(r, c, player);
                    const def = evaluatePoint(r, c, opp);
                    const centerBonus = (7 - Math.abs(r - 7)) + (7 - Math.abs(c - 7));
                    let score = atk + def * defWeight + centerBonus;
                    candidates.push({ r, c, score });
                }
            }
        }
        return candidates.sort((a, b) => b.score - a.score);
    }

    function evaluatePoint(r, c, player) {
        let score = 0; const dirs = [[1,0], [0,1], [1,1], [1,-1]];
        dirs.forEach(([dr, dc]) => {
            let count = 1; let block = 0;
            for (let i = 1; i <= 4; i++) {
                const nr = r + dr * i, nc = c + dc * i;
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                    if (board[nr][nc] === player) count++; else if (board[nr][nc] !== 0) { block++; break; } else break;
                } else { block++; break; }
            }
            for (let i = 1; i <= 4; i++) {
                const nr = r - dr * i, nc = c - dc * i;
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                    if (board[nr][nc] === player) count++; else if (board[nr][nc] !== 0) { block++; break; } else break;
                } else { block++; break; }
            }
            if (count >= 5) score += 1000000;
            else if (count === 4) {
                if (block === 0) score += 100000;
                else if (block === 1) score += 10000;
            }
            else if (count === 3) {
                if (block === 0) score += 10000;
                else if (block === 1) score += 1000;
            }
            else if (count === 2) {
                if (block === 0) score += 1000;
                else if (block === 1) score += 100;
            }
        });
        return score;
    }

    function hasNeighbor(r, c) {
        for (let i = -2; i <= 2; i++) {
            for (let j = -2; j <= 2; j++) {
                if (i === 0 && j === 0) continue;
                const nr = r + i, nc = c + j;
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] !== 0) return true;
            }
        }
        return false;
    }

    function getRandomEmpty() {
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) { if (board[r][c] === 0) return { r, c }; }
        }
        return null;
    }

    /* ================= 多用户管理与切换系统 ================= */

            aiDiffId: aiConfig ? aiConfig.id : 'easy'

        try {

                if (data.pveUserId) pveUserId = data.pveUserId;

                if (data.pvpBottomUserId) pvpBottomUserId = data.pvpBottomUserId;
                if (data.aiDiffId) {

    function ensureDefaultUsers() {
        if (usersList.length > 0) return;
        try {
            const raw = localStorage.getItem(USERS_STORAGE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    usersList = parsed;
                }
            }
        } catch (e) {}

        if (usersList.length === 0) {
            usersList = [
                { id: 'u_player_1', name: '玩家甲', color: AVATAR_COLORS[0], isSystem: false },
                { id: 'u_guest_default', name: '访客', color: AVATAR_COLORS[1], isSystem: false }
            ];
            saveUsersList();
        }
        if (!usersList.some(u => u.id === pveUserId)) pveUserId = usersList[0].id;
        if (!usersList.some(u => u.id === pvpTopUserId)) pvpTopUserId = usersList[0].id;
        if (!usersList.some(u => u.id === pvpBottomUserId) || pvpBottomUserId === pvpTopUserId) {
            const other = usersList.find(u => u.id !== pvpTopUserId);
            pvpBottomUserId = other ? other.id : usersList[0].id;
        }
    }

    function ensureDistinctPvpUsers() {
        ensureDefaultUsers();
        if (pvpTopUserId === pvpBottomUserId) {
            const other = usersList.find(u => u.id !== pvpTopUserId);
            if (other) {
                pvpBottomUserId = other.id;
            } else {
                const extraUser = {
                    id: 'u_player_2_' + Date.now(),
                    name: '玩家乙',
                    color: AVATAR_COLORS[1],
                    isSystem: false
                };

                saveUsersList();

        if (event) event.stopPropagation();

        showPrompt(`修改用户【${targetUser.name}】名称`, targetUser.name, (newVal) => {

                showToast('用户名称不能为空');

    function deleteUser(userId, event) {
        if (event) event.stopPropagation();
        const targetUser = getUserById(userId);
        if (!targetUser) return;
        if (usersList.length <= 2) {
            showToast('至少保留 2 位用户以支持双人对战');
            return;
        }
        showConfirm(`确定删除用户【${targetUser.name}】及其对弈记录吗？`, () => {
            usersList = usersList.filter(u => u.id !== userId);
            saveUsersList();

            // 若删除的是当前选中的用户，自动回退到其他可用用户
            if (pveUserId === userId) pveUserId = usersList[0].id;
            if (pvpTopUserId === userId) {
                const avail = usersList.find(u => u.id !== pvpBottomUserId) || usersList[0];
                pvpTopUserId = avail.id;
            }
            if (pvpBottomUserId === userId) {
                const avail = usersList.find(u => u.id !== pvpTopUserId) || usersList[0];
                pvpBottomUserId = avail.id;
            }
            ensureDistinctPvpUsers();

            // 同步清理该用户的对弈记录
            const pveAll = loadAllBattleRecords(PVE_USER_RECORDS_KEY);
            if (pveAll[userId]) {
                delete pveAll[userId];
                saveAllBattleRecords(pveAll, PVE_USER_RECORDS_KEY);
            }
            const pvpAll = loadAllBattleRecords(PVP_RECORDS_KEY);
            if (pvpAll[userId]) {
                delete pvpAll[userId];
                saveAllBattleRecords(pvpAll, PVP_RECORDS_KEY);
            }

            renderUserList();
            syncPlayerZonesLayout();
            updateUI();
            if (canvas && ctx) draw();
            showToast('用户已删除');
        });
    }

        if (currentUserPickerTarget === 'manage') return;

            if (pvpPhase !== 'dice') {
                SFX.wrong();
                showToast('已开局，不可切换用户', targetSide);
                closeUserModal();
                return;

            if (areBothPvpDiceRolled()) {
                SFX.wrong();
                showToast('已投掷，不可切换用户', targetSide);
                closeUserModal();

                SFX.wrong();
                showToast('已投掷，不可切换用户', targetSide);
                closeUserModal();
                return;
            }

    /* ================= 人机 & 双人对弈记录管理 ================= */
    function loadAllBattleRecords(storageKey = PVE_USER_RECORDS_KEY) {
        try {
            const raw = localStorage.getItem(storageKey);
            return raw ? JSON.parse(raw) : {};
        } catch (e) {
            return {};
        }
    }

    function saveAllBattleRecords(data, storageKey = PVE_USER_RECORDS_KEY) {
        PermanentStore.setItem(storageKey, JSON.stringify(data));
    }

    function formatDuration(sec) {
        const s = Math.max(1, Math.round(sec));
        const m = Math.floor(s / 60);
        const rem = s % 60;
        return m > 0 ? `${m}分${rem < 10 ? '0' : ''}${rem}秒` : `${rem}秒`;
    }

    function formatDateTime(ts) {
        const d = new Date(ts);
        const pad = n => (n < 10 ? '0' + n : '' + n);
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    // 保存人机对战记录：严格绑定当前 userId -> diffId，隔离不同用户的记录
    function savePveBattleRecord(resultType) {
        if (gameMode !== 'pve') return;
        const all = loadAllBattleRecords(PVE_USER_RECORDS_KEY);
        const meUser = getUserById(pveUserId);
        const diffId = aiConfig.id;

        if (!all[meUser.id] || typeof all[meUser.id] !== 'object') all[meUser.id] = {};
        if (!Array.isArray(all[meUser.id][diffId])) all[meUser.id][diffId] = [];

        const now = Date.now();
        const durationSec = gameStartTime ? (now - gameStartTime) / 1000 : 1;
        const myMoves = history.filter(h => h.player === playerColor).length;

        all[meUser.id][diffId].unshift({
            timestamp: now,
            playedAt: formatDateTime(now),
            duration: formatDuration(durationSec),
            result: resultType, // 'win' | 'lose' | 'draw'
            myColor: playerColor, // 1: 执黑先手, 2: 执白后手
            myMoves: myMoves,
            userId: meUser.id,
            userName: meUser.name
        });

        saveAllBattleRecords(all, PVE_USER_RECORDS_KEY);
    }

    // 保存双人对战记录（根据本局掷骰子分配的 pvpTopColor / pvpBottomColor 准确存入双方各自名下）
    function savePvpBattleRecord(winColor) {
        if (gameMode !== 'pvp') return;
        const all = loadAllBattleRecords(PVP_RECORDS_KEY);
        const topUser = getUserById(pvpTopUserId);
        const bottomUser = getUserById(pvpBottomUserId);

        const now = Date.now();
        const durationSec = gameStartTime ? (now - gameStartTime) / 1000 : 1;
        const durationStr = formatDuration(durationSec);
        const playedAtStr = formatDateTime(now);
        const topMoves = history.filter(h => h.player === pvpTopColor).length;
        const bottomMoves = history.filter(h => h.player === pvpBottomColor).length;

        if (!Array.isArray(all[topUser.id])) all[topUser.id] = [];
        all[topUser.id].unshift({
            timestamp: now,
            playedAt: playedAtStr,
            duration: durationStr,
            result: winColor === 0 ? 'draw' : (winColor === pvpTopColor ? 'win' : 'lose'),
            myColor: pvpTopColor,
            myMoves: topMoves,
            opponentId: bottomUser.id,
            opponentName: bottomUser.name
        });

        if (bottomUser.id !== topUser.id) {
            if (!Array.isArray(all[bottomUser.id])) all[bottomUser.id] = [];
            all[bottomUser.id].unshift({
                timestamp: now,
                playedAt: playedAtStr,
                duration: durationStr,
                result: winColor === 0 ? 'draw' : (winColor === pvpBottomColor ? 'win' : 'lose'),
                myColor: pvpBottomColor,
                myMoves: bottomMoves,
                opponentId: topUser.id,
                opponentName: topUser.name
            });
        }

        saveAllBattleRecords(all, PVP_RECORDS_KEY);
    }

                        <div class="record-card">
                            <div class="record-card-top">
                                <span>#${list.length - idx} · 用户：${recUser}</span>
                                <span class="record-badge ${resClass}">${resText}</span>
                            </div>
                            <div class="record-card-meta">
                                <span>${sideText}</span>
                                <span>下子：${item.myMoves}手</span>
                                <span>用时：${item.duration}</span>
                                <span>时间：${item.playedAt}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        } else {
            // 双人对战：展示当前点击状态栏所属用户与其他用户的对弈记录
            const targetUser = getUserById(side === 'top' ? pvpTopUserId : pvpBottomUserId);
            const all = loadAllBattleRecords(PVP_RECORDS_KEY);
            const list = Array.isArray(all[targetUser.id]) ? all[targetUser.id] : [];

            document.getElementById('recordModalTitle').innerText = `${targetUser.name}的对弈记录`;
            document.getElementById('recordDiffBadge').innerText = '双人对战';

            const wins = list.filter(r => r.result === 'win').length;
            const loses = list.filter(r => r.result === 'lose').length;
            const draws = list.filter(r => r.result === 'draw').length;
            document.getElementById('recordSummary').innerHTML =
                `<span>用户：${targetUser.name} · 共 ${list.length} 局</span><span>胜 ${wins} / 负 ${loses} / 平 ${draws}</span>`;

            const container = document.getElementById('recordList');
            if (list.length === 0) {
                container.innerHTML = `<div class="record-empty">【${targetUser.name}】暂无双人对弈记录</div>`;
            } else {
                container.innerHTML = list.map((item, idx) => {
                    const resText = item.result === 'win' ? '我方胜利' : (item.result === 'lose' ? `${item.opponentName}胜利` : '平局');
                    const resClass = item.result === 'win' ? 'win' : (item.result === 'lose' ? 'lose' : 'draw');
                    const sideText = item.myColor === 1 ? '我方执黑先手' : '我方执白后手';
                    return `
                        <div class="record-card">
                            <div class="record-card-top">
                                <span>#${list.length - idx} · 对手：${item.opponentName}</span>
                                <span class="record-badge ${resClass}">${resText}</span>
                            </div>
                            <div class="record-card-meta">
                                <span>${sideText}</span>
                                <span>下子：${item.myMoves}手</span>
                                <span>用时：${item.duration}</span>
                                <span>时间：${item.playedAt}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        document.getElementById('recordModal').classList.add('active');
    }

    function closeRecordModal() {
        document.getElementById('recordModal').classList.remove('active');
        document.getElementById('recordModalBox').style.transform = 'none';
    }

    function clearCurrentRecords() {
        if (currentRecordContext.mode === 'pve') {
            const meUser = getUserById(pveUserId);
            const all = loadAllBattleRecords(PVE_USER_RECORDS_KEY);
            const userMap = (all[meUser.id] && typeof all[meUser.id] === 'object') ? all[meUser.id] : {};
            const list = Array.isArray(userMap[aiConfig.id]) ? userMap[aiConfig.id] : [];
            if (list.length === 0) {
                showToast('当前用户在此难度下没有可清空的记录');
                return;
            }
            showConfirm(`确定清空【${meUser.name}】在【${aiConfig.name}】的全部对弈记录吗？`, () => {
                all[meUser.id][aiConfig.id] = [];
                saveAllBattleRecords(all, PVE_USER_RECORDS_KEY);
                openBattleRecords(currentRecordContext.side);
                showToast('对弈记录已清空');
            });
        } else {
            const targetUser = getUserById(currentRecordContext.side === 'top' ? pvpTopUserId : pvpBottomUserId);
            const all = loadAllBattleRecords(PVP_RECORDS_KEY);
            const list = Array.isArray(all[targetUser.id]) ? all[targetUser.id] : [];
            if (list.length === 0) {
                showToast('当前用户没有可清空的记录');
                return;
            }
            showConfirm(`确定清空【${targetUser.name}】的全部双人对弈记录吗？`, () => {
                all[targetUser.id] = [];
                saveAllBattleRecords(all, PVP_RECORDS_KEY);
                openBattleRecords(currentRecordContext.side);
                showToast('对弈记录已清空');
            });
        }
    }

</script>
</body>
</html>
