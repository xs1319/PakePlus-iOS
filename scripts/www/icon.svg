<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景深蓝渐变，营造沉稳专注的氛围 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- 外圈靶心渐变（青绿到蓝绿，象征冷静与心流） -->
    <linearGradient id="outerRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- 核心焦点渐变（暖橙到金黄，象征能量、专注点与训练营的热情） -->
    <linearGradient id="coreGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="55%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- 柔和发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 圆角方形应用图标底板 -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#bgGrad)" />

  <!-- 微妙的内描边 -->
  <rect x="28" y="28" width="456" height="456" rx="108" ry="108" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />

  <!-- 最外层虚线专注环（象征排除干扰、锁定范围） -->
  <circle cx="256" cy="264" r="156" fill="none" stroke="#38BDF8" stroke-width="6" stroke-dasharray="28 18" stroke-linecap="round" opacity="0.45" />

  <!-- 次外层靶心圆环 -->
  <circle cx="256" cy="264" r="118" fill="none" stroke="url(#outerRingGrad)" stroke-width="18" opacity="0.9" />

  <!-- 内层深色衬底圆 -->
  <circle cx="256" cy="264" r="82" fill="#0F172A" stroke="#1E293B" stroke-width="4" />

  <!-- 中心专注核心：向上聚拢的能量/光锥造型 -->
  <g filter="url(#glow)">
    <path d="M256 172
             C284 208, 304 236, 304 268
             C304 296, 282 318, 256 318
             C230 318, 208 296, 208 268
             C208 236, 228 208, 256 172 Z" fill="url(#coreGrad)" />
    <!-- 最中心高光锚点 -->
    <circle cx="256" cy="268" r="18" fill="#FFFBEB" />
  </g>

  <!-- 四向准星刻度（强化“瞄准与聚焦”意象） -->
  <g stroke="#E2E8F0" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <!-- 上 -->
    <line x1="256" y1="84" x2="256" y2="116" />
    <!-- 下 -->
    <line x1="256" y1="412" x2="256" y2="444" />
    <!-- 左 -->
    <line x1="76" y1="264" x2="108" y2="264" />
    <!-- 右 -->
    <line x1="404" y1="264" x2="436" y2="264" />
  </g>
</svg>